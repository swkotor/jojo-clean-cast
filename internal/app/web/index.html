<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>jojo-podcasts</title>
<style>
  :root {
    --bg: #0f1117;
    --card: #1a1d27;
    --card-hover: #20242f;
    --border: #2a2e3b;
    --text: #e8eaf0;
    --muted: #8b90a0;
    --accent: #8b5cf6;
    --accent-hover: #7c3aed;
    --green: #34d399;
    --amber: #fbbf24;
    --red: #f87171;
    --cyan: #22d3ee;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
  }
  header { padding: 28px 32px 8px; display: flex; align-items: center; gap: 14px; }
  header .logo {
    width: 44px; height: 44px;
    background: linear-gradient(135deg, var(--accent), #ec4899);
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
  }
  header h1 { font-size: 24px; font-weight: 700; }
  header .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
  #stats { color: var(--muted); font-size: 12px; margin-top: 3px; }
  #remoteLink {
    display: none; margin-left: auto; color: var(--accent); font-size: 13px;
    text-decoration: none; border: 1px solid var(--border); border-radius: 8px; padding: 8px 14px;
  }

  .add-bar { margin: 20px 32px 8px; display: flex; gap: 10px; }
  .add-bar input {
    flex: 1; background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; padding: 12px 16px; color: var(--text); font-size: 14px; outline: none;
  }
  .add-bar input:focus { border-color: var(--accent); }
  .add-bar button {
    background: var(--accent); border: none; border-radius: 10px; color: white;
    padding: 12px 22px; font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap;
  }
  .add-bar button:hover { background: var(--accent-hover); }
  .add-bar button:disabled { opacity: .5; cursor: wait; }
  #status { margin: 0 32px 4px; font-size: 13px; min-height: 18px; }
  #status.ok { color: var(--green); }
  #status.err { color: var(--red); }

  .toolbar { display: flex; justify-content: space-between; align-items: center; padding: 0 32px; gap: 10px; }
  .toolbar .right { display: flex; gap: 8px; }
  .toolbar button, .toolbar a {
    background: none; border: 1px solid var(--border); color: var(--muted);
    border-radius: 8px; padding: 6px 14px; font-size: 12px; cursor: pointer; text-decoration: none;
  }
  .toolbar button:hover, .toolbar a:hover { color: var(--text); }
  .err-count { color: var(--red); font-weight: 700; }

  #logPanel {
    margin: 10px 32px 0; background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; max-height: 260px; overflow-y: auto; display: none;
    font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 12px;
  }
  #logPanel.open { display: block; }
  .log-line { display: flex; gap: 10px; padding: 5px 14px; border-bottom: 1px solid rgba(42,46,59,.5); }
  .log-line .t { color: var(--muted); flex-shrink: 0; }
  .log-line.error .m { color: var(--red); }
  .log-line.info .m { color: var(--text); }
  .log-empty { padding: 14px; color: var(--muted); }

  #browsePanel {
    margin: 10px 32px 0; background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; display: none; max-height: 420px; overflow-y: auto;
  }
  #browsePanel.open { display: block; }
  #browsePanel h3 { font-size: 13px; padding: 14px 16px 6px; color: var(--muted); display:flex; justify-content:space-between; }
  #browsePanel h3 button { background:none; border:none; color:var(--muted); cursor:pointer; font-size:14px; }
  .pl-row { display: flex; align-items: center; gap: 12px; padding: 8px 16px; border-top: 1px solid rgba(42,46,59,.5); font-size: 13px; }
  .pl-row img { width: 48px; height: 36px; border-radius: 6px; object-fit: cover; background: var(--border); }
  .pl-row .t { flex: 1; }
  .pl-row .c { color: var(--muted); font-size: 12px; }
  .pl-row button {
    background: var(--accent); border: none; border-radius: 8px; color: white;
    padding: 6px 14px; font-size: 12px; font-weight: 600; cursor: pointer;
  }
  .pl-row button:disabled { opacity: .5; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(400px, 1fr)); gap: 18px; padding: 0 32px 20px; }
  .chan-head {
    margin: 22px 32px 0; border: 1px solid var(--border); border-radius: 14px;
    overflow: hidden; background: var(--card);
  }
  .chan-head .banner { width: 100%; height: 84px; object-fit: cover; display: block; }
  .chan-head .row { display: flex; align-items: center; gap: 12px; padding: 10px 16px; }
  .chan-head img.avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; background: var(--border); }
  .chan-head .name { font-weight: 700; font-size: 15px; flex: 1; }
  .chan-head .cnt { color: var(--muted); font-size: 12px; }
  .chan-head .row { cursor: pointer; }
  .chan-head.collapsed { opacity: .85; }
  .chan-head.collapsed:hover { opacity: 1; }
  .chan-head .caret {
    border: none; background: none; color: var(--muted);
    font-size: 14px; padding: 2px 4px; cursor: pointer; flex-shrink: 0;
  }
  .chan-head .caret:hover { color: var(--text); }
  .chan-head button {
    background: none; border: 1px solid var(--border); color: var(--muted);
    border-radius: 8px; padding: 6px 12px; font-size: 12px; cursor: pointer;
  }
  .chan-head button.danger:hover { color: var(--red); border-color: var(--red); }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; }
  .card-head { display: flex; gap: 14px; padding: 16px; align-items: flex-start; }
  .cover { position: relative; width: 72px; height: 72px; flex-shrink: 0; cursor: pointer; }
  .cover img { width: 72px; height: 72px; border-radius: 12px; object-fit: cover; background: var(--border); display: block; }
  .cover .cover-hint {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,.55); border-radius: 12px; color: white; font-size: 18px;
    opacity: 0; transition: opacity .15s;
  }
  .cover:hover .cover-hint { opacity: 1; }
  .card-head .info { flex: 1; min-width: 0; }
  .card-head h2 {
    font-size: 16px; font-weight: 700; overflow: hidden; text-overflow: ellipsis;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  }
  .card-head h2 .rename { cursor: pointer; color: var(--muted); font-size: 13px; margin-left: 6px; border: none; background: none; }
  .card-head h2 .rename:hover { color: var(--accent); }
  .orig-name { color: var(--muted); font-size: 11.5px; margin-top: 2px; font-style: italic; }
  .meta { display: flex; gap: 8px; align-items: center; margin-top: 6px; flex-wrap: wrap; }
  .badge {
    font-size: 10px; font-weight: 700; letter-spacing: .06em; padding: 3px 8px;
    border-radius: 20px; background: rgba(139, 92, 246, .15); color: var(--accent);
  }
  .badge.channel { background: rgba(236, 72, 153, .15); color: #ec4899; }
  .badge.filter { background: rgba(34, 211, 238, .15); color: var(--cyan); }
  .ep-count { color: var(--muted); font-size: 12px; }
  .chip {
    font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 20px;
    cursor: pointer; color: var(--muted); border: 1px solid var(--border); background: none;
  }
  .chip:hover { color: var(--text); }
  .chip.on { color: var(--green); border-color: rgba(52,211,153,.4); background: rgba(52,211,153,.08); }
  .yt-link {
    font-size: 11px; font-weight: 600; color: #f87171; text-decoration: none;
    padding: 3px 8px; border: 1px solid rgba(248,113,113,.3); border-radius: 20px;
  }
  .yt-link:hover { background: rgba(248,113,113,.12); }

  .actions { display: flex; gap: 8px; padding: 0 16px 14px; flex-wrap: wrap; }
  .actions a, .actions button {
    flex: 1; text-align: center; text-decoration: none; font-size: 12.5px; font-weight: 600;
    padding: 9px 4px; border-radius: 9px; border: 1px solid var(--border);
    background: transparent; color: var(--text); cursor: pointer; min-width: 100px;
  }
  .actions .apple { background: linear-gradient(135deg, #9333ea, #c026d3); border: none; color: white; }
  .actions .remote { background: linear-gradient(135deg, #0891b2, #2563eb); border: none; color: white; }
  .actions .apple:hover, .actions .remote:hover { filter: brightness(1.1); }
  .actions button:hover { background: var(--card-hover); }
  .actions .autodl-on { color: var(--green); border-color: rgba(52,211,153,.4); }
  .actions .autodl-off { color: var(--muted); }
  .actions .del { flex: 0 0 42px; min-width: 42px; color: var(--muted); }
  .actions .del:hover { color: var(--red); border-color: var(--red); }

  .episodes { border-top: 1px solid var(--border); }
  .episodes h3 {
    font-size: 11px; letter-spacing: .08em; color: var(--muted); font-weight: 600;
    text-transform: uppercase; padding: 12px 16px 4px; display: flex; justify-content: space-between; align-items: center;
  }
  .episodes h3 button { background: none; border: none; color: var(--accent); cursor: pointer; font-size: 11px; font-weight: 600; }
  .ep { display: flex; align-items: center; gap: 10px; padding: 7px 16px; font-size: 13px; }
  .ep:last-child { padding-bottom: 14px; }
  .ep .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .ep .dot.dl { background: var(--green); box-shadow: 0 0 6px rgba(52,211,153,.6); }
  .ep .dot.nd { background: var(--border); }
  .ep .dot.dling { background: var(--amber); box-shadow: 0 0 6px rgba(251,191,36,.6); animation: pulse 1.2s infinite; }
  .ep .dot.fail { background: var(--red); box-shadow: 0 0 6px rgba(248,113,113,.6); }
  @keyframes pulse { 50% { opacity: .35; } }
  .ep .title { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: var(--text); }
  .ep .date { color: var(--muted); font-size: 11.5px; flex-shrink: 0; }
  .ep-btn {
    flex-shrink: 0; font-size: 10.5px; font-weight: 600; padding: 4px 10px;
    border-radius: 7px; border: 1px solid var(--border); background: transparent;
    cursor: pointer; width: 92px; text-align: center;
  }
  .ep-btn.download { color: var(--accent); border-color: rgba(139,92,246,.4); }
  .ep-btn.download:hover { background: rgba(139,92,246,.15); }
  .ep-btn.retry { color: var(--red); border-color: rgba(248,113,113,.4); }
  .ep-btn.delete { color: var(--muted); }
  .ep-btn.delete:hover { color: var(--red); border-color: var(--red); }
  .ep-btn.busy { color: var(--amber); border-color: rgba(251,191,36,.4); cursor: default; }

  .empty { grid-column: 1/-1; text-align: center; color: var(--muted); padding: 60px 0; }

  /* modal */
  #modalWrap {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,.6);
    z-index: 50; align-items: flex-start; justify-content: center; padding: 6vh 16px;
  }
  #modalWrap.open { display: flex; }
  #modal {
    background: var(--card); border: 1px solid var(--border); border-radius: 16px;
    width: 100%; max-width: 720px; max-height: 84vh; display: flex; flex-direction: column;
  }
  #modal .m-head { display: flex; align-items: center; gap: 12px; padding: 16px 18px; border-bottom: 1px solid var(--border); }
  #modal .m-head h2 { font-size: 16px; flex: 1; }
  #modal .m-head input {
    background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 12px; color: var(--text); font-size: 13px; width: 220px; outline: none;
  }
  #modal .m-head .close { background: none; border: none; color: var(--muted); font-size: 20px; cursor: pointer; }
  #modal .m-body { overflow-y: auto; padding: 6px 0 12px; }
  #modal .m-more { text-align: center; padding: 10px; }
  #modal .m-more button {
    background: none; border: 1px solid var(--border); color: var(--muted);
    border-radius: 8px; padding: 6px 18px; cursor: pointer; font-size: 12px;
  }
  .series-row { display: flex; align-items: center; gap: 12px; padding: 10px 18px; border-top: 1px solid rgba(42,46,59,.5); font-size: 13px; }
  .series-row .t { flex: 1; }
  .series-row .ex-box { width: 15px; height: 15px; accent-color: var(--cyan); cursor: pointer; flex-shrink: 0; }
  .series-row .c { color: var(--muted); font-size: 12px; }
  .series-row button {
    background: var(--accent); border: none; border-radius: 8px; color: white;
    padding: 6px 14px; font-size: 12px; font-weight: 600; cursor: pointer;
  }
  .m-custom { display: flex; gap: 8px; padding: 12px 18px; }
  .m-custom input { flex: 1; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; color: var(--text); font-size: 13px; outline: none; }
  .m-custom button { background: var(--accent); border: none; border-radius: 8px; color: white; padding: 8px 16px; font-size: 12px; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>
<header>
  <div class="logo">🎙️</div>
  <div>
    <h1>jojo-podcasts</h1>
    <div class="sub">YouTube → clean podcast feeds, sponsor-free</div>
    <div id="stats"></div>
  </div>
  <a id="remoteLink" href="#" target="_blank">Remote dashboard ↗</a>
</header>

<div class="add-bar">
  <input id="input" placeholder="Paste a YouTube playlist/channel URL, playlist ID (PL…), channel ID (UC…), @handle, or a …/playlists URL to browse" onkeydown="if(event.key==='Enter')addPodcast()">
  <button id="addBtn" onclick="addPodcast()">Add podcast</button>
  <button style="background:#0891b2" title="List a channel's podcasts & playlists so you can subscribe individually or in bulk" onclick="browsePlaylists(document.getElementById('input').value.trim())">Browse channel</button>
</div>
<div id="status"></div>
<div class="toolbar">
  <button id="logToggle" onclick="toggleLog()">Activity log <span id="errCount" class="err-count"></span></button>
  <div class="right">
    <button onclick="setAllChannels(true)">⊟ Collapse all</button>
    <button onclick="setAllChannels(false)">⊞ Expand all</button>
    <a id="opmlLink" href="/opml" download>Export OPML</a>
    <button onclick="loadAll()">↻ Refresh</button>
  </div>
</div>
<div id="logPanel"></div>

<div class="grid" id="grid"><div class="empty">Loading…</div></div>
<input type="file" id="coverFile" accept=".jpg,.jpeg,.png,.webp" style="display:none" onchange="uploadCover(this)">

<div id="modalWrap" onclick="if(event.target===this)closeModal()">
  <div id="modal">
    <div class="m-head">
      <h2 id="modalTitle"></h2>
      <input id="modalSearch" placeholder="Search episodes…" style="display:none" onkeydown="if(event.key==='Enter')searchEpisodes()">
      <button class="close" onclick="closeModal()">✕</button>
    </div>
    <div class="m-body" id="modalBody"></div>
  </div>
</div>

<script>
const token = new URLSearchParams(location.search).get('token');
const tok = token ? '?token=' + encodeURIComponent(token) : '';
let publicUrl = '';
let sbDefault = '';
let remoteTok = tok;
let coverVersion = Date.now();
let coverPodcastId = null;
let collapsed = new Set();
let groupIds = [];
try { collapsed = new Set(JSON.parse(localStorage.getItem('jojoCollapsed') || '[]')); } catch (e) {}

fetch('/api/config' + tok).then(r => r.json()).then(c => {
  publicUrl = c.publicUrl || '';
  sbDefault = c.sbDefault || '';
  if (c.token) remoteTok = '?token=' + encodeURIComponent(c.token);
  const link = document.getElementById('remoteLink');
  if (publicUrl && remoteTok) {
    link.href = publicUrl + '/' + remoteTok;
    link.style.display = 'inline-block';
  }
  if (tok) document.getElementById('opmlLink').href = '/opml' + tok;
  load();
}).catch(() => {});

function fmtDate(iso) {
  return new Date(iso).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
}
function fmtTime(iso) {
  return new Date(iso).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' });
}
function ago(unixSec) {
  const s = Math.floor(Date.now() / 1000) - unixSec;
  if (s < 90) return 'just now';
  if (s < 5400) return Math.round(s / 60) + 'm ago';
  if (s < 129600) return Math.round(s / 3600) + 'h ago';
  return Math.round(s / 86400) + 'd ago';
}
function esc(s) {
  return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function epRow(e) {
  let btn, dotCls;
  if (e.downloading) { btn = '<button class="ep-btn busy">Downloading…</button>'; dotCls = 'dling'; }
  else if (e.downloaded) { btn = `<button class="ep-btn delete" onclick="deleteEpisode('${esc(e.videoId)}')">Delete</button>`; dotCls = 'dl'; }
  else if (e.failedCount > 0) { btn = `<button class="ep-btn retry" title="${e.failedCount} failed attempt(s)" onclick="downloadEpisode('${esc(e.videoId)}', this)">Retry (${e.failedCount}✗)</button>`; dotCls = 'fail'; }
  else { btn = `<button class="ep-btn download" onclick="downloadEpisode('${esc(e.videoId)}', this)">Download</button>`; dotCls = 'nd'; }
  return `
    <div class="ep">
      <div class="dot ${dotCls}"></div>
      <div class="title" title="${esc(e.name)}">${esc(e.name)}</div>
      <div class="date">${fmtDate(e.publishedDate)}</div>
      ${btn}
    </div>`;
}

async function load() {
  const grid = document.getElementById('grid');
  try {
    const res = await fetch('/api/podcasts' + tok);
    if (!res.ok) throw new Error(await res.text());
    let pods = await res.json();
    // nest filtered sub-feeds directly after their parent
    const parents = pods.filter(p => !p.parentId);
    const ordered = [];
    for (const par of parents) {
      ordered.push(par);
      for (const child of pods.filter(p => p.parentId === par.id)) ordered.push(child);
    }
    for (const orphan of pods.filter(p => p.parentId && !parents.some(x => x.id === p.parentId))) ordered.push(orphan);
    pods = ordered;
    window._pods = pods;
    if (!pods.length) {
      grid.innerHTML = '<div class="empty">No podcasts yet — add one above 👆</div>';
      return;
    }

    // group by owning channel (children inherit their parent's channel)
    const chanOf = p => {
      if (p.parentId) {
        const par = pods.find(x => x.id === p.parentId);
        if (par) return par.channelId || '';
      }
      return p.channelId || '';
    };
    const groups = new Map();
    for (const p of pods) {
      const cid = chanOf(p) || '__ungrouped__';
      if (!groups.has(cid)) groups.set(cid, []);
      groups.get(cid).push(p);
    }

    const renderCard = p => {
      const feedUrl = location.origin + p.feedPath + tok;
      const isVirtual = p.type === 'FILTER';
      const ytId = isVirtual ? p.parentId : p.id;
      const ytUrl = (p.type === 'CHANNEL') ? 'https://www.youtube.com/channel/' + esc(ytId) : 'https://www.youtube.com/playlist?list=' + esc(ytId);
      const eps = (p.episodes || []).map(epRow).join('') || '<div class="ep"><div class="title" style="color:var(--muted)">No episodes tracked yet</div></div>';
      const origLine = p.customName ? `<div class="orig-name">YouTube: ${esc(p.originalName)}</div>` : '';
      const filterLine = isVirtual
        ? `<div class="orig-name">${p.titleFilter ? `filter: "${esc(p.titleFilter)}"` : 'everything except'}${p.excludeFilter ? ` · excluding: ${esc(p.excludeFilter.split('|').join(', '))}` : ''}</div>`
        : '';
      const badgeCls = isVirtual ? 'filter' : (p.type === 'CHANNEL' ? 'channel' : '');
      return `
      <div class="card">
        <div class="card-head">
          <div class="cover" title="Click to upload custom cover art" onclick="pickCover('${esc(p.id)}')">
            <img src="${esc(p.imageUrl.startsWith('/covers/') ? p.imageUrl + '?v=' + coverVersion : p.imageUrl)}" loading="lazy" onerror="this.style.visibility='hidden'">
            <div class="cover-hint">✎</div>
          </div>
          <div class="info">
            <h2>${esc(p.name)}<button class="rename" title="Rename feed" onclick="renamePodcast('${esc(p.id)}')">✎</button></h2>
            ${origLine}${filterLine}
            ${p.imageUrl.startsWith('/covers/') ? `<div class="orig-name"><a href="#" style="color:var(--muted)" onclick="resetCover('${esc(p.id)}');return false">↺ reset cover art</a></div>` : ''}
            <div class="meta">
              <span class="badge ${badgeCls}">${p.type}</span>
              <span class="chip ${p.subscribed ? 'on' : ''}" title="Mark as subscribed on your devices" onclick="toggleSubscribed('${esc(p.id)}', ${p.subscribed})">${p.subscribed ? '✓ Subscribed' : '○ Not subscribed'}</span>
              <span class="ep-count">${p.episodeCount} episodes</span>
              <a class="yt-link" target="_blank" rel="noopener" href="${ytUrl}">▶ YouTube</a>
              <button class="chip ${p.sbCategories ? 'on' : ''}" title="SponsorBlock categories for this feed" onclick="openSbEditor('${esc(p.id)}')">SB: ${esc(p.sbCategories || sbDefault || 'sponsor')}</button>
              ${!isVirtual ? `<button class="chip" title="Create a filtered sub-feed from a recurring series in this feed" onclick="openSplit('${esc(p.id)}')">⑂ Split</button>` : ''}
              ${p.lastFeedFetch ? `<span class="ep-count" title="Last time a podcast app fetched this feed">· polled ${ago(p.lastFeedFetch)}</span>` : ''}
            </div>
          </div>
        </div>
        <div class="actions">
          <a class="apple" href="podcast://${location.host}${p.feedPath}${tok}">${publicUrl ? 'Subscribe (local)' : 'Subscribe in Apple Podcasts'}</a>
          ${publicUrl ? `<a class="remote" href="podcast://${esc(publicUrl.replace(/^https?:\/\//,''))}${p.feedPath}${remoteTok}">Subscribe (remote)</a>` : ''}
          <button onclick="copyFeed('${esc(publicUrl ? publicUrl + p.feedPath + remoteTok : feedUrl)}', this)">Copy RSS URL</button>
          <button class="${p.autoDownload ? 'autodl-on' : 'autodl-off'}" title="Toggle automatic download of new episodes" onclick="toggleAutoDl('${esc(p.id)}', ${p.autoDownload})">Auto-DL: ${p.autoDownload ? 'ON' : 'OFF'}</button>
          <button class="del" title="Remove subscription" onclick="removePodcast('${esc(p.id)}', '${esc(p.name).replace(/'/g, "\\'")}')">✕</button>
        </div>
        <div class="episodes">
          <h3>Recent episodes <button onclick="openBrowser('${esc(p.id)}')">All episodes →</button></h3>
          ${eps}
        </div>
      </div>`;
    };

    // render: channel header + its grid, ungrouped last
    const entries = [...groups.entries()].sort((a, b) => {
      if (a[0] === '__ungrouped__') return 1;
      if (b[0] === '__ungrouped__') return -1;
      const an = (a[1][0].channelTitle || ''), bn = (b[1][0].channelTitle || '');
      return an.localeCompare(bn);
    });
    groupIds = entries.map(([cid]) => cid);
    grid.outerHTML = '<div id="grid"></div>';
    const root = document.getElementById('grid');
    root.style.padding = '0';
    root.innerHTML = entries.map(([cid, list]) => {
      const first = list.find(p => p.channelTitle) || list[0];
      const open = !collapsed.has(cid);
      const caret = `<button class="caret" title="${open ? 'Collapse' : 'Expand'}" onclick="toggleChannel('${esc(cid)}')">${open ? '▾' : '▸'}</button>`;
      const head = cid === '__ungrouped__'
        ? `<div class="chan-head${open ? '' : ' collapsed'}"><div class="row" onclick="toggleChannel('${esc(cid)}')">${caret}<div class="name">Other feeds</div><div class="cnt">${list.length} feed(s)</div></div></div>`
        : `<div class="chan-head${open ? '' : ' collapsed'}">
             ${open && first.channelBanner ? `<img class="banner" src="${esc(first.channelBanner)}=w1600" onerror="this.style.display='none'">` : ''}
             <div class="row" onclick="if(!event.target.closest('button,a'))toggleChannel('${esc(cid)}')">
               ${caret}
               <img class="avatar" src="${esc(first.channelThumb)}" onerror="this.style.visibility='hidden'">
               <div class="name">${esc(first.channelTitle || 'Channel')}</div>
               <div class="cnt">${list.length} feed(s)</div>
               <a class="yt-link" target="_blank" rel="noopener" href="https://www.youtube.com/channel/${esc(cid)}">▶ Channel</a>
               <button onclick="browsePlaylists('${esc(cid)}')">＋ Browse channel</button>
               <button class="danger" onclick="removeChannel('${esc(cid)}', '${esc(first.channelTitle || 'this channel').replace(/'/g, "\\'")}', ${list.length})">🗑 Remove all</button>
             </div>
           </div>`;
      return head + (open ? `<div class="grid">` + list.map(renderCard).join('') + `</div>` : '');
    }).join('');
  } catch (e) {
    document.getElementById('grid').innerHTML = '<div class="empty">Failed to load: ' + esc(e.message) + '</div>';
  }
}

function toggleChannel(cid) {
  if (collapsed.has(cid)) collapsed.delete(cid); else collapsed.add(cid);
  try { localStorage.setItem('jojoCollapsed', JSON.stringify([...collapsed])); } catch (e) {}
  load();
}
function setAllChannels(collapse) {
  collapsed = new Set(collapse ? [...groupIds] : []);
  try { localStorage.setItem('jojoCollapsed', JSON.stringify([...collapsed])); } catch (e) {}
  load();
}

async function removeChannel(channelId, name, count) {
  if (!confirm(`Remove all ${count} feed(s) from "${name}"? Downloaded audio files are kept.`)) return;
  const res = await fetch('/api/channels/' + encodeURIComponent(channelId) + tok, { method: 'DELETE' });
  if (res.ok) loadAll();
  else alert('Failed to remove channel feeds');
}

async function loadEvents() {
  try {
    const res = await fetch('/api/events' + tok);
    if (!res.ok) return;
    const events = await res.json();
    const errs = events.filter(e => e.level === 'error').length;
    document.getElementById('errCount').textContent = errs ? `(${errs} errors)` : '';
    const panel = document.getElementById('logPanel');
    panel.innerHTML = events.length
      ? events.map(e => `<div class="log-line ${e.level}"><span class="t">${fmtTime(e.time)}</span><span class="m">${esc(e.message)}</span></div>`).join('')
      : '<div class="log-empty">No activity yet</div>';
  } catch (e) {}
}

async function loadStats() {
  try {
    const res = await fetch('/api/stats' + tok);
    if (!res.ok) return;
    const s = await res.json();
    const gb = (s.storedBytes / 1e9).toFixed(1);
    const hrs = (s.totalSkippedSeconds / 3600).toFixed(1);
    document.getElementById('stats').textContent =
      `${s.storedFiles} episodes on disk · ${gb} GB · SponsorBlock has skipped ${hrs}h of sponsors for you`;
  } catch (e) {}
}

function loadAll() { load(); loadEvents(); loadStats(); }
function toggleLog() { document.getElementById('logPanel').classList.toggle('open'); }

async function addPodcast() {
  const input = document.getElementById('input');
  const btn = document.getElementById('addBtn');
  const status = document.getElementById('status');
  const val = input.value.trim();
  if (!val) return;

  // channel playlists URL → browse mode
  if (/\/playlists\/?$/.test(val)) return browsePlaylists(val);

  btn.disabled = true;
  status.className = '';
  status.textContent = 'Adding — fetching metadata and episodes from YouTube, this can take a minute…';
  try {
    const res = await fetch('/api/podcasts' + tok, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ input: val })
    });
    const body = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(body.message || 'Failed to add podcast');
    status.className = 'ok';
    status.textContent = `Added "${body.name}" ✓ — recent episodes will start downloading automatically`;
    input.value = '';
    loadAll();
  } catch (e) {
    status.className = 'err';
    status.textContent = e.message;
  } finally {
    btn.disabled = false;
  }
}

function plRow(pl) {
  const have = (window._pods || []).some(p => p.id === pl.id);
  return `
    <div class="pl-row" data-plid="${esc(pl.id)}">
      <img src="${esc(pl.thumbnail)}" loading="lazy" onerror="this.style.visibility='hidden'">
      <div class="t">${esc(pl.title)}</div>
      <div class="c">${pl.count} videos</div>
      ${have
        ? `<button style="background:none;border:1px solid rgba(52,211,153,.4);color:var(--green)" onclick="removePodcast('${esc(pl.id)}','${esc(pl.title).replace(/'/g, "\\'")}')">✓ Subscribed — remove</button>`
        : `<button onclick="subscribePlaylist('${esc(pl.id)}', this)">Subscribe</button>`}
    </div>`;
}

async function browsePlaylists(url) {
  const status = document.getElementById('status');
  if (!url) { status.className = 'err'; status.textContent = 'Enter a channel URL, ID, or @handle first'; return; }

  // open the overlay immediately, in view wherever the page is scrolled to
  document.getElementById('modalTitle').textContent = 'Browsing channel…';
  document.getElementById('modalSearch').style.display = 'none';
  const body = document.getElementById('modalBody');
  body.innerHTML = '<div class="log-empty">Looking up channel podcasts &amp; playlists…</div>';
  document.getElementById('modalWrap').classList.add('open');
  status.className = '';
  status.textContent = '';

  try {
    const res = await fetch('/api/browse-playlists' + tok, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ input: url })
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.message || 'Failed to list playlists');
    const pods = data.podcasts || [], lists = data.playlists || [];
    const have = new Set((window._pods || []).map(p => p.id));
    const newPods = pods.map(p => p.id).filter(id => !have.has(id));
    const newLists = lists.map(p => p.id).filter(id => !have.has(id));
    const allIds = [...newPods, ...newLists];

    document.getElementById('modalTitle').textContent = data.channelTitle || 'Channel';
    body.innerHTML =
      (data.channelBanner ? `<img src="${esc(data.channelBanner)}=w1600" style="width:100%;display:block;max-height:110px;object-fit:cover">` : '') +
      `<div class="pl-row" style="border-top:none;padding:12px 18px;flex-wrap:wrap">
        <img src="${esc(data.channelThumb)}" style="border-radius:50%;width:44px;height:44px" onerror="this.style.visibility='hidden'">
        <div class="t" style="font-weight:700;font-size:15px">${esc(data.channelTitle || 'Channel')}</div>
        <button onclick="subscribePlaylist('${esc(data.channelId)}', this)" title="One feed with all channel uploads">Whole channel</button>
        ${newPods.length ? `<button onclick='subscribeAll(${JSON.stringify(newPods)}, this, "podcasts")'>All podcasts (${newPods.length})</button>` : ''}
        ${newLists.length ? `<button onclick='subscribeAll(${JSON.stringify(newLists)}, this, "playlists")'>All playlists (${newLists.length})</button>` : ''}
        ${allIds.length ? `<button onclick='subscribeAll(${JSON.stringify(allIds)}, this, "feeds")'>Everything (${allIds.length})</button>` : ''}
      </div>` +
      (pods.length ? `<h3 style="font-size:12px;padding:12px 18px 4px;color:var(--muted)">🎙️ Podcasts (${pods.length})</h3>` + pods.map(plRow).join('') : '') +
      (lists.length ? `<h3 style="font-size:12px;padding:12px 18px 4px;color:var(--muted)">📃 Playlists (${lists.length})</h3>` + lists.map(plRow).join('') : '') +
      (!pods.length && !lists.length ? '<div class="log-empty">No podcasts or playlists on this channel</div>' : '');
  } catch (e) {
    body.innerHTML = '<div class="log-empty" style="color:var(--red)">' + esc(e.message) + '</div>';
  }
}

async function subscribeAll(ids, btn, label) {
  const status = document.getElementById('status');
  const what = label || 'items';
  if (!confirm(`Subscribe to all ${ids.length} new ${what}? Each one fetches its full episode list, so this can take a while.`)) return;
  btn.disabled = true;
  let ok = 0, fail = 0;
  for (let i = 0; i < ids.length; i++) {
    status.className = '';
    status.textContent = `Subscribing ${i + 1} of ${ids.length}… (each feed fetches its full episode list, please wait)`;
    const rowBtn = document.querySelector(`.pl-row[data-plid="${CSS.escape(ids[i])}"] button`);
    try {
      const res = await fetch('/api/podcasts' + tok, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ input: ids[i] })
      });
      if (!res.ok) throw new Error();
      ok++;
      if (rowBtn) { rowBtn.textContent = 'Added ✓'; rowBtn.disabled = true; }
    } catch (e) {
      fail++;
      if (rowBtn) rowBtn.textContent = 'Failed ✗';
    }
  }
  status.className = fail ? 'err' : 'ok';
  status.textContent = `Bulk subscribe done: ${ok} added${fail ? ', ' + fail + ' failed' : ''} ✓`;
  btn.textContent = 'Done ✓';
  loadAll();
}

// keep the older inline panel helper harmless if anything still calls it
function closeBrowse() { closeModal(); }
async function subscribePlaylist(id, btn) {
  btn.disabled = true;
  btn.textContent = 'Adding…';
  try {
    const res = await fetch('/api/podcasts' + tok, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ input: id })
    });
    const body = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(body.message || 'Failed');
    btn.textContent = 'Added ✓';
    loadAll();
  } catch (e) {
    btn.disabled = false;
    btn.textContent = 'Subscribe';
    alert(e.message);
  }
}

/* ---- episode browser modal ---- */
let browserId = null, browserOffset = 0;
function openBrowser(id) {
  browserId = id; browserOffset = 0;
  const p = (window._pods || []).find(x => x.id === id);
  document.getElementById('modalTitle').textContent = p ? p.name : 'Episodes';
  const s = document.getElementById('modalSearch');
  s.style.display = 'inline-block'; s.value = '';
  document.getElementById('modalBody').innerHTML = '<div class="log-empty">Loading…</div>';
  document.getElementById('modalWrap').classList.add('open');
  fetchEpisodes(false);
}
function searchEpisodes() { browserOffset = 0; fetchEpisodes(false); }
async function fetchEpisodes(append) {
  const q = document.getElementById('modalSearch').value.trim();
  const body = document.getElementById('modalBody');
  const res = await fetch(`/api/podcasts/${encodeURIComponent(browserId)}/episodes${tok ? tok + '&' : '?'}q=${encodeURIComponent(q)}&offset=${browserOffset}&limit=50`);
  if (!res.ok) { body.innerHTML = '<div class="log-empty">Failed to load episodes</div>'; return; }
  const data = await res.json();
  const rows = (data.episodes || []).map(epRow).join('');
  const shown = browserOffset + (data.episodes || []).length;
  const more = shown < data.total ? `<div class="m-more"><button onclick="browserOffset=${shown};fetchEpisodes(true)">Load more (${shown}/${data.total})</button></div>` : `<div class="m-more" style="color:var(--muted);font-size:12px">${data.total} episodes</div>`;
  if (append) {
    body.querySelector('.m-more')?.remove();
    body.insertAdjacentHTML('beforeend', rows + more);
  } else {
    body.innerHTML = (rows || '<div class="log-empty">No matching episodes</div>') + more;
  }
}
function closeModal() {
  document.getElementById('modalWrap').classList.remove('open');
  document.getElementById('modalBody').innerHTML = '';
}

/* ---- split (filtered sub-feed) ---- */
async function openSplit(id) {
  const p = (window._pods || []).find(x => x.id === id);
  document.getElementById('modalTitle').textContent = 'Split "' + (p ? p.name : '') + '" into a filtered feed';
  document.getElementById('modalSearch').style.display = 'none';
  const body = document.getElementById('modalBody');
  body.innerHTML = '<div class="log-empty">Detecting recurring series…</div>';
  document.getElementById('modalWrap').classList.add('open');
  const res = await fetch(`/api/podcasts/${encodeURIComponent(id)}/series` + tok);
  const series = res.ok ? await res.json() : [];
  window._series = series || [];
  const rows = (series || []).map((s, i) => `
    <div class="series-row">
      <input type="checkbox" class="ex-box" id="ex${i}" data-name="${esc(s.name)}" checked title="Include in the 'everything else' exclusions">
      <div class="t">${esc(s.name)}</div>
      <div class="c">${s.count} episodes</div>
      <button onclick="createSplit('${esc(id)}', '${esc(s.name).replace(/'/g, "\\'")}', this)">Create feed</button>
    </div>`).join('');
  body.innerHTML =
    `<div class="m-custom">
       <input id="customFilter" placeholder="…or type a custom title filter (case-insensitive substring)">
       <button onclick="createSplit('${esc(id)}', document.getElementById('customFilter').value, this)">Create feed</button>
     </div>` +
    ((series || []).length
      ? `<div class="m-custom" style="border-top:1px solid var(--border);align-items:center">
           <div style="flex:1;font-size:12.5px;color:var(--muted)">
             Or make an <b style="color:var(--text)">“everything else”</b> feed — the full show with the ticked series below removed.
           </div>
           <button style="background:var(--cyan);color:#06202a" onclick="createInverse('${esc(id)}', this)">⊘ Everything else</button>
         </div>` : '') +
    (rows || '<div class="log-empty">No recurring series detected — use a custom filter above</div>');
}

async function createInverse(parentId, btn) {
  const boxes = [...document.querySelectorAll('.ex-box')].filter(b => b.checked);
  if (!boxes.length) { alert('Tick at least one series to exclude'); return; }
  const exclude = boxes.map(b => b.dataset.name);
  btn.disabled = true;
  const res = await fetch(`/api/podcasts/${encodeURIComponent(parentId)}/split` + tok, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ exclude })
  });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) { btn.disabled = false; alert(body.message || 'Failed to create feed'); return; }
  closeModal();
  loadAll();
}
async function createSplit(parentId, filter, btn) {
  filter = (filter || '').trim();
  if (!filter) return;
  btn.disabled = true;
  const res = await fetch(`/api/podcasts/${encodeURIComponent(parentId)}/split` + tok, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ filter })
  });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) { btn.disabled = false; alert(body.message || 'Failed to create filtered feed'); return; }
  closeModal();
  loadAll();
}

/* ---- misc actions ---- */
function pickCover(id) { coverPodcastId = id; document.getElementById('coverFile').click(); }
async function uploadCover(input) {
  if (!input.files.length || !coverPodcastId) return;
  const fd = new FormData();
  fd.append('image', input.files[0]);
  const res = await fetch('/api/podcasts/' + encodeURIComponent(coverPodcastId) + '/cover' + tok, { method: 'POST', body: fd });
  input.value = '';
  if (res.ok) { coverVersion = Date.now(); loadAll(); }
  else { const b = await res.json().catch(() => ({})); alert(b.message || 'Failed to upload cover art'); }
}
async function resetCover(id) {
  if (!confirm('Revert to the original YouTube cover art?')) return;
  const res = await fetch('/api/podcasts/' + encodeURIComponent(id) + '/cover' + tok, { method: 'DELETE' });
  if (res.ok) { coverVersion = Date.now(); loadAll(); }
}
async function patchPodcast(id, payload) {
  const res = await fetch('/api/podcasts/' + encodeURIComponent(id) + tok, {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  });
  if (res.ok) loadAll();
  else alert('Update failed');
}
async function renamePodcast(id) {
  const p = (window._pods || []).find(x => x.id === id);
  const current = p ? (p.customName || p.originalName) : '';
  const name = prompt('New feed name (leave empty to revert to the YouTube name):', current);
  if (name === null) return;
  patchPodcast(id, { name });
}
// The official SponsorBlock categories yt-dlp understands. These can be
// toggled but never removed from the list.
const SB_STANDARD = [
  ['sponsor', 'Paid promotion / sponsor read'],
  ['selfpromo', 'Unpaid self-promotion'],
  ['interaction', 'Like & subscribe reminders'],
  ['intro', 'Intro / intermission animation'],
  ['outro', 'Outro / end cards'],
  ['preview', 'Recap or preview of the episode'],
  ['music_offtopic', 'Non-music section in a music video'],
  ['filler', 'Tangential filler / jokes'],
];
let sbState = { id: null, selected: new Set(), custom: [] };

function openSbEditor(id) {
  const p = (window._pods || []).find(x => x.id === id);
  const effective = (p && p.sbCategories) ? p.sbCategories : (sbDefault || '');
  const list = effective.split(',').map(s => s.trim()).filter(Boolean);
  const std = SB_STANDARD.map(c => c[0]);
  sbState = {
    id,
    selected: new Set(list),
    custom: list.filter(c => !std.includes(c)),
    usingDefault: !(p && p.sbCategories)
  };
  document.getElementById('modalTitle').textContent = 'SponsorBlock — ' + (p ? p.name : '');
  document.getElementById('modalSearch').style.display = 'none';
  document.getElementById('modalWrap').classList.add('open');
  renderSbEditor();
}

function renderSbEditor() {
  const rows = SB_STANDARD.map(([key, desc]) => sbRow(key, desc, false)).join('') +
    sbState.custom.map(key => sbRow(key, 'Custom category', true)).join('');
  document.getElementById('modalBody').innerHTML = `
    <div style="padding:10px 18px;font-size:12.5px;color:var(--muted)">
      Toggle which segments yt-dlp removes for this feed.
      ${sbState.usingDefault ? `Currently inheriting the global default (<b style="color:var(--text)">${esc(sbDefault || 'sponsor')}</b>).` : ''}
    </div>
    ${rows}
    <div class="m-custom" style="border-top:1px solid var(--border)">
      <input id="sbNew" placeholder="Add a custom category (e.g. poi_highlight)" onkeydown="if(event.key==='Enter')addSbCustom()">
      <button onclick="addSbCustom()">Add</button>
    </div>
    <div class="m-custom" style="border-top:1px solid var(--border)">
      <div style="flex:1;font-size:12px;color:var(--muted)">Selected: ${[...sbState.selected].join(', ') || 'none (nothing will be cut)'}</div>
      <button style="background:none;border:1px solid var(--border);color:var(--muted)" onclick="saveSb(true)">Use global default</button>
      <button onclick="saveSb(false)">Save</button>
    </div>`;
}

function sbRow(key, desc, isCustom) {
  const on = sbState.selected.has(key);
  return `
    <div class="series-row">
      <input type="checkbox" class="ex-box" ${on ? 'checked' : ''} onchange="toggleSb('${esc(key)}')">
      <div class="t">
        <span style="font-weight:600;color:${isCustom ? 'var(--amber)' : 'var(--text)'}">${esc(key)}</span>
        ${isCustom ? '<span class="badge" style="margin-left:6px;background:rgba(251,191,36,.15);color:var(--amber)">CUSTOM</span>' : ''}
        <div style="font-size:11.5px;color:var(--muted)">${esc(desc)}</div>
      </div>
      ${isCustom
        ? `<button style="background:none;border:1px solid var(--border);color:var(--muted)" title="Remove this custom category" onclick="removeSbCustom('${esc(key)}')">✕</button>`
        : `<span class="c" title="Standard category — can be toggled but not removed">standard</span>`}
    </div>`;
}

function toggleSb(key) {
  if (sbState.selected.has(key)) sbState.selected.delete(key); else sbState.selected.add(key);
  sbState.usingDefault = false;
  renderSbEditor();
}
function addSbCustom() {
  const input = document.getElementById('sbNew');
  const val = (input.value || '').trim().toLowerCase().replace(/[^a-z0-9_]/g, '');
  if (!val) return;
  const std = SB_STANDARD.map(c => c[0]);
  if (!std.includes(val) && !sbState.custom.includes(val)) sbState.custom.push(val);
  sbState.selected.add(val);
  sbState.usingDefault = false;
  renderSbEditor();
}
function removeSbCustom(key) {
  sbState.custom = sbState.custom.filter(c => c !== key);
  sbState.selected.delete(key);
  sbState.usingDefault = false;
  renderSbEditor();
}
async function saveSb(useDefault) {
  const cats = useDefault ? '' : [...sbState.selected].join(',');
  await patchPodcast(sbState.id, { sbCategories: cats });
  closeModal();
}
function toggleSubscribed(id, current) { patchPodcast(id, { subscribed: !current }); }
function toggleAutoDl(id, current) { patchPodcast(id, { autoDownload: !current }); }

async function downloadEpisode(videoId, btn) {
  btn.textContent = 'Starting…';
  btn.className = 'ep-btn busy';
  const res = await fetch('/api/episodes/' + encodeURIComponent(videoId) + '/download' + tok, { method: 'POST' });
  if (!res.ok) alert('Failed to start download');
  setTimeout(loadAll, 2000);
}
async function deleteEpisode(videoId) {
  if (!confirm('Delete the downloaded audio file for this episode? It can be re-downloaded any time.')) return;
  const res = await fetch('/api/episodes/' + encodeURIComponent(videoId) + '/file' + tok, { method: 'DELETE' });
  if (res.ok) loadAll();
  else alert('Failed to delete file');
}
async function removePodcast(id, name) {
  if (!confirm(`Remove "${name}" from jojo-podcasts? Downloaded audio files are kept.`)) return;
  const res = await fetch('/api/podcasts/' + encodeURIComponent(id) + tok, { method: 'DELETE' });
  if (res.ok) loadAll();
  else alert('Failed to remove podcast');
}
function copyFeed(url, btn) {
  navigator.clipboard.writeText(url).then(() => {
    const old = btn.textContent;
    btn.textContent = 'Copied ✓';
    setTimeout(() => btn.textContent = old, 1500);
  });
}

loadAll();
setInterval(loadAll, 20000);
