<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark light">
<title>jojo-podcasts</title>
<script>
// apply the saved theme before first paint (no flash)
try { var t = localStorage.getItem('jojoTheme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
</script>
<style>
  :root {
    --bg: #0e1016; --bg2: #141722; --card: #181b26; --card-hover: #1f2330; --border: #2a2f3e; --border-soft: rgba(255,255,255,.06);
    --text: #eceef5; --muted: #a0a6b8;
    --accent: #a78bfa; --accent-solid: #7c3aed; --accent-solid-hover: #6d28d9; --on-accent: #fff;
    --green: #34d399; --amber: #fbbf24; --red: #f87171; --cyan: #22d3ee; --pink: #f472b6;
    --focus: #c4b5fd; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.25);
    --overlay: rgba(4,5,10,.7);
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f3f4f9; --bg2: #eaecf4; --card: #ffffff; --card-hover: #f4f5fb; --border: #d6d9e6; --border-soft: rgba(0,0,0,.06);
      --text: #181b27; --muted: #566074;
      --accent: #6d28d9; --accent-solid: #6d28d9; --accent-solid-hover: #5b21b6;
      --green: #047857; --amber: #8a4b04; --red: #b91c1c; --cyan: #0e7490; --pink: #be185d;
      --focus: #5b21b6; --shadow: 0 1px 2px rgba(20,24,40,.08), 0 8px 24px rgba(20,24,40,.08);
      --overlay: rgba(20,24,40,.45);
    }
  }
  :root[data-theme="light"] {
    --bg: #f3f4f9; --bg2: #eaecf4; --card: #ffffff; --card-hover: #f4f5fb; --border: #d6d9e6; --border-soft: rgba(0,0,0,.06);
    --text: #181b27; --muted: #566074;
    --accent: #6d28d9; --accent-solid: #6d28d9; --accent-solid-hover: #5b21b6;
    --green: #047857; --amber: #8a4b04; --red: #b91c1c; --cyan: #0e7490; --pink: #be185d;
    --focus: #5b21b6; --shadow: 0 1px 2px rgba(20,24,40,.08), 0 8px 24px rgba(20,24,40,.08);
    --overlay: rgba(20,24,40,.45);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--bg); color: var(--text); min-height: 100vh; line-height: 1.4;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  svg.i { width: 1.1em; height: 1.1em; flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vertical-align: -.18em; }

  .wrap { max-width: 1480px; margin: 0 auto; padding: 0 16px; }
  @media (min-width: 700px) { .wrap { padding: 0 32px; } }

  /* app shell: sidebar + content */
  .app { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100vh; }
  .content { min-width: 0; }
  .sidebar {
    position: sticky; top: 0; height: 100vh; overflow-y: auto; background: var(--bg2); border-right: 1px solid var(--border);
    padding: 18px 12px 14px; display: flex; flex-direction: column; gap: 2px; z-index: 60;
  }
  .sb-top { display: flex; align-items: center; gap: 10px; padding: 0 6px 14px; }
  .sb-top .logo { width: 38px; height: 38px; border-radius: 11px; }
  .sb-top .logo svg { width: 20px; height: 20px; }
  .brand { font-weight: 750; font-size: 17px; letter-spacing: -.01em; flex: 1; min-width: 0; }
  #navClose, #menuBtn { display: none; }
  .nav-sec { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 14px 10px 4px; }
  .nav-item {
    display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; text-decoration: none;
    background: none; border: 1px solid transparent; color: var(--muted); border-radius: 10px; padding: 9px 10px; font-size: 14px; font-weight: 600;
  }
  .nav-item:hover { background: var(--card-hover); color: var(--text); }
  .nav-item[aria-current="page"] { background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--text); border-color: color-mix(in srgb, var(--accent) 45%, transparent); }
  .nav-item[aria-current="page"] svg { color: var(--accent); }
  .nav-item .lbl { flex: 1; min-width: 0; }
  .nav-item .cnt { font-size: 12px; font-variant-numeric: tabular-nums; color: var(--muted); }
  .nav-item .cnt.warn { color: var(--red); font-weight: 700; }
  .sidebar { overscroll-behavior: contain; }
  /* channel / source tree (disclosure buttons) */
  #navTree ul { list-style: none; }
  #navTree ul ul { margin-left: 14px; padding-left: 6px; border-left: 1px solid var(--border); }
  .tg, .pi {
    display: flex; align-items: center; gap: 7px; width: 100%; min-width: 0; text-align: left; background: none; border: 1px solid transparent;
    color: var(--muted); border-radius: 9px; padding: 7px 8px; font-size: 13.5px; font-weight: 600;
  }
  .tg:hover, .pi:hover { background: var(--card-hover); color: var(--text); }
  .tg .caret, .pi .caret { transition: transform .15s; flex-shrink: 0; }
  .tg[aria-expanded="true"] > .caret, .pi[aria-expanded="true"] > .caret { transform: rotate(90deg); }
  .tg .nm, .pi .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tg .nm { color: var(--text); }
  .pi { font-weight: 500; }
  .pi[aria-current="true"], .pi-flat[aria-current="true"] { background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--text); border-color: color-mix(in srgb, var(--accent) 45%, transparent); }
  .tg .av { width: 20px; height: 20px; border-radius: 50%; object-fit: cover; background: var(--border); flex-shrink: 0; }
  .tg .ic { flex-shrink: 0; }
  .tcnt { font-size: 12px; font-variant-numeric: tabular-nums; color: var(--muted); flex-shrink: 0; }
  .tfail { font-size: 11px; font-weight: 700; color: var(--red); background: color-mix(in srgb, var(--red) 12%, transparent); border-radius: 10px; padding: 0 6px; flex-shrink: 0; }
  .pi-flat { display: block; width: 100%; text-align: left; background: none; border: 1px solid transparent; color: var(--muted); border-radius: 9px; padding: 6px 8px; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pi-flat:hover { background: var(--card-hover); color: var(--text); }
  .pi-static { padding: 6px 8px; font-size: 12.5px; color: var(--muted); display: flex; gap: 8px; }
  .pdet { margin: 2px 0 6px 12px; padding: 8px 10px; border: 1px solid var(--border); border-radius: 10px; background: var(--card); font-size: 12.5px; color: var(--muted); display: flex; flex-direction: column; gap: 5px; }
  .pdet b { color: var(--text); font-weight: 650; }
  .pdet .st { display: flex; gap: 4px 10px; flex-wrap: wrap; }
  .pdet .ok { color: var(--green); } .pdet .busy { color: var(--amber); } .pdet .bad { color: var(--red); }
  .pdet .pa { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 2px; }
  .tree-empty { font-size: 12.5px; color: var(--muted); padding: 4px 10px; }
  .sb-foot { margin-top: auto; padding-top: 12px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 2px; }
  #navBackdrop { display: none; }
  @media (max-width: 899px) {
    .app { display: block; }
    .sidebar {
      position: fixed; top: 0; bottom: 0; left: 0; height: auto; width: min(300px, 86vw); transform: translateX(-102%); visibility: hidden;
      transition: transform .2s ease, visibility 0s linear .2s; box-shadow: var(--shadow);
    }
    .sidebar.open { transform: none; visibility: visible; transition: transform .2s ease, visibility 0s; }
    #navBackdrop.open { display: block; position: fixed; inset: 0; background: var(--overlay); z-index: 55; }
    #navClose, #menuBtn { display: inline-flex; }
    body.drawer-open { overflow: hidden; }
  }
  .view-intro { color: var(--muted); font-size: 13.5px; margin: 6px 0 12px; }

  /* header */
  header { padding: 20px 0 8px; display: flex; align-items: center; gap: 12px; }
  .hd-text { min-width: 0; flex: 1; }
  .head-actions { flex-wrap: nowrap !important; flex-shrink: 0; }
  @media (max-width: 699px) { .controls .spacer { display: none; } }
  .logo {
    width: 46px; height: 46px; border-radius: 13px; color: #fff; flex-shrink: 0;
    background: linear-gradient(135deg, #7c3aed, #ec4899); display: flex; align-items: center; justify-content: center;
    box-shadow: 0 6px 18px rgba(124,58,237,.35);
  }
  .logo svg { width: 24px; height: 24px; }
  header h1 { font-size: 22px; font-weight: 750; letter-spacing: -.01em; }
  header .sub { color: var(--muted); font-size: 13px; margin-top: 1px; }
  .head-actions { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    background: var(--card); border: 1px solid var(--border); color: var(--text);
    border-radius: 9px; padding: 8px 13px; font-size: 13px; font-weight: 600; text-decoration: none; white-space: nowrap;
    transition: background .15s, border-color .15s;
  }
  .btn:hover { background: var(--card-hover); border-color: var(--muted); }
  .btn.primary { background: var(--accent-solid); border-color: var(--accent-solid); color: var(--on-accent); }
  .btn.primary:hover { background: var(--accent-solid-hover); }
  .btn.ghost { background: transparent; color: var(--muted); }
  .btn.ghost:hover { color: var(--text); }
  .btn:disabled { opacity: .55; cursor: wait; }
  .btn.icon { padding: 8px; }
  .btn.sm { padding: 5px 10px; font-size: 12px; }

  /* summary tiles */
  .tiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin: 8px 0 4px; }
  .tiles > :last-child:nth-child(odd) { grid-column: 1 / -1; }
  @media (min-width: 700px) { .tiles { grid-template-columns: repeat(5, 1fr); } .tiles > :last-child:nth-child(odd) { grid-column: auto; } }
  .tile { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; min-width: 0; text-align: left; }
  button.tile:hover { background: var(--card-hover); }
  .tile .v { font-size: 22px; font-weight: 750; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
  .tile .l { font-size: 12px; color: var(--muted); margin-top: 1px; }
  .tile.warn .v { color: var(--red); }
  .tile.good .v { color: var(--green); }
  .tile.busy .v { color: var(--amber); }
  .tile .skel { display: inline-block; width: 40px; height: 22px; border-radius: 6px; background: var(--border); }

  .alert {
    display: none; align-items: center; gap: 10px; margin-top: 10px; padding: 10px 14px; border-radius: 10px; font-size: 13px;
    background: color-mix(in srgb, var(--red) 12%, var(--card)); border: 1px solid color-mix(in srgb, var(--red) 40%, transparent);
  }
  .alert.show { display: flex; }
  .alert .grow { flex: 1; min-width: 0; }

  /* add bar */
  .add-bar { margin: 16px 0 6px; display: flex; gap: 10px; flex-wrap: wrap; }
  .add-bar .field { flex: 1 1 280px; position: relative; }
  .add-bar input {
    width: 100%; background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 14px; font-size: 14px;
  }
  .add-bar input::placeholder, .search input::placeholder { color: var(--muted); opacity: 1; }
  .add-bar input:focus { border-color: var(--accent); }
  .add-bar .btn { padding: 12px 18px; font-size: 14px; }
  .hint { font-size: 12px; color: var(--muted); margin: 0 0 4px; }
  #status { font-size: 13px; padding: 2px 0; }
  #status:empty { display: none; }
  [hidden] { display: none !important; }
  #status.ok { color: var(--green); }
  #status.err { color: var(--red); }

  /* controls */
  .controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 10px 0 6px; }
  .search { position: relative; flex: 1 1 220px; max-width: 420px; }
  .search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
  .search input { width: 100%; background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 9px 12px 9px 34px; font-size: 14px; }
  .search input:focus { border-color: var(--accent); }
  .seg { display: flex; gap: 6px; flex-wrap: wrap; }
  .pill {
    background: transparent; border: 1px solid var(--border); color: var(--muted); border-radius: 999px;
    padding: 5px 12px; font-size: 12.5px; font-weight: 600; white-space: nowrap;
  }
  .pill:hover { color: var(--text); border-color: var(--muted); }
  .pill[aria-pressed="true"] { background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--text); border-color: var(--accent); }
  .pill .n { opacity: .8; font-variant-numeric: tabular-nums; margin-left: 3px; }
  .controls .spacer { flex: 1; }
  .err-count { color: var(--red); font-weight: 700; }

  /* log */
  #logPanel { margin: 8px 0 0; background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .log-bar { display: flex; gap: 8px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--border); font-size: 12.5px; color: var(--muted); }
  .log-bar .grow { flex: 1; }
  #logList { max-height: 65vh; overflow-y: auto; font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 12px; }
  .log-line { display: flex; gap: 10px; padding: 5px 14px; border-bottom: 1px solid var(--border-soft); }
  .log-line .t { color: var(--muted); flex-shrink: 0; }
  .log-line .m { min-width: 0; overflow-wrap: anywhere; }
  .log-line.error .m { color: var(--red); }
  .log-empty { padding: 16px; color: var(--muted); font-size: 13px; }
  .log-empty.err { color: var(--red); }

  /* channel groups */
  #grid { padding-bottom: 40px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(420px, 100%), 1fr)); gap: 16px; padding: 14px 0 6px; }
  .chan-head { margin: 22px 0 0; border: 1px solid var(--border); border-radius: 14px; overflow: hidden; background: var(--card); }
  .chan-head .banner { width: 100%; height: 84px; object-fit: cover; display: block; }
  .chan-head .row { display: flex; align-items: center; gap: 10px; padding: 10px 14px; flex-wrap: wrap; }
  .chan-head .toggle { display: flex; align-items: center; gap: 10px; flex: 1 1 200px; min-width: 0; background: none; border: none; text-align: left; padding: 2px; }
  .chan-head img.avatar { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; background: var(--border); flex-shrink: 0; }
  .chan-head .name { font-weight: 700; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chan-head .cnt { color: var(--muted); font-size: 12.5px; white-space: nowrap; }
  .chan-head .caret { color: var(--muted); transition: transform .15s; }
  .chan-head .caret.open { transform: rotate(90deg); }
  .chan-head .tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .btn.danger:hover { color: var(--red); border-color: var(--red); }

  /* cards */
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; min-width: 0; box-shadow: var(--shadow); }
  .card.has-fail { border-color: color-mix(in srgb, var(--red) 45%, var(--border)); }
  .card-head { display: flex; gap: 14px; padding: 16px 16px 10px; align-items: flex-start; }
  .cover { position: relative; width: 76px; height: 76px; flex-shrink: 0; border: none; background: none; padding: 0; border-radius: 12px; }
  .cover img { width: 76px; height: 76px; border-radius: 12px; object-fit: cover; background: var(--border); display: block; }
  .cover .cover-hint {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,.6); border-radius: 12px; color: #fff; opacity: 0; transition: opacity .15s;
  }
  .cover:hover .cover-hint, .cover:focus-visible .cover-hint { opacity: 1; }
  .card-head .info { flex: 1; min-width: 0; }
  .card-head h2 { font-size: 16px; font-weight: 700; line-height: 1.25; display: flex; gap: 6px; align-items: flex-start; }
  .card-head h2 .ttl { overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow-wrap: anywhere; min-width: 0; }
  .link-btn { background: none; border: none; color: var(--muted); padding: 2px 4px; border-radius: 6px; font-size: 12px; text-decoration: none; }
  .link-btn:hover { color: var(--accent); }
  .orig-name { color: var(--muted); font-size: 12px; margin-top: 2px; overflow-wrap: anywhere; }
  .meta { display: flex; gap: 6px; align-items: center; margin-top: 8px; flex-wrap: wrap; }
  .badge {
    font-size: 10.5px; font-weight: 750; letter-spacing: .06em; padding: 3px 8px; border-radius: 20px;
    background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent);
  }
  .badge.channel { background: color-mix(in srgb, var(--pink) 16%, transparent); color: var(--pink); }
  .badge.filter { background: color-mix(in srgb, var(--cyan) 16%, transparent); color: var(--cyan); }
  .ep-count { color: var(--muted); font-size: 12px; }
  .chip {
    display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 600; padding: 3px 9px; border-radius: 20px;
    color: var(--muted); border: 1px solid var(--border); background: none; text-decoration: none;
  }
  .chip:hover { color: var(--text); border-color: var(--muted); }
  .chip.on { color: var(--green); border-color: color-mix(in srgb, var(--green) 50%, transparent); background: color-mix(in srgb, var(--green) 10%, transparent); }
  .chip.yt { color: var(--red); border-color: color-mix(in srgb, var(--red) 40%, transparent); }
  .chip.yt:hover { background: color-mix(in srgb, var(--red) 12%, transparent); }

  .summary { display: flex; gap: 6px; flex-wrap: wrap; padding: 0 16px 10px; }
  .sbadge { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 650; padding: 3px 9px; border-radius: 8px; background: var(--bg2); color: var(--muted); }
  .sbadge.ok { color: var(--green); } .sbadge.fail { color: var(--red); } .sbadge.busy { color: var(--amber); }
  .sbadge.fail { background: color-mix(in srgb, var(--red) 12%, transparent); }

  .actions { display: flex; gap: 8px; padding: 0 16px 14px; flex-wrap: wrap; }
  .actions .btn { flex: 1 1 auto; font-size: 12.5px; padding: 8px 10px; }
  .actions .apple { background: linear-gradient(135deg, #7c3aed, #c026d3); border-color: transparent; color: #fff; }
  .actions .remote { background: linear-gradient(135deg, #0e7490, #2563eb); border-color: transparent; color: #fff; }
  .actions .apple:hover, .actions .remote:hover { filter: brightness(1.12); }
  .actions .autodl-on { color: var(--green); border-color: color-mix(in srgb, var(--green) 50%, transparent); }
  .actions .autodl-off { color: var(--muted); }
  .actions .del { flex: 0 0 auto; color: var(--muted); }
  .actions .del:hover { color: var(--red); border-color: var(--red); }

  .episodes { border-top: 1px solid var(--border); }
  .episodes h3 {
    font-size: 11px; letter-spacing: .08em; color: var(--muted); font-weight: 650;
    text-transform: uppercase; padding: 10px 16px 2px; display: flex; justify-content: space-between; align-items: center;
  }
  .episodes h3 button { background: none; border: none; color: var(--accent); font-size: 12px; font-weight: 650; text-transform: none; letter-spacing: 0; }
  .ep { display: flex; align-items: center; gap: 10px; padding: 7px 16px; font-size: 13px; min-width: 0; }
  .ep:last-child { padding-bottom: 14px; }
  .ep .st { display: inline-flex; align-items: center; justify-content: center; width: 18px; flex-shrink: 0; }
  .ep .st.dl { color: var(--green); } .ep .st.nd { color: var(--muted); } .ep .st.dling { color: var(--amber); } .ep .st.fail { color: var(--red); }
  .ep .st.dling svg { animation: spin 1.4s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .ep .title { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; min-width: 0; }
  .ep .date { color: var(--muted); font-size: 12px; flex-shrink: 0; }
  .ep-btn {
    flex-shrink: 0; font-size: 11.5px; font-weight: 650; padding: 4px 8px; border-radius: 7px;
    border: 1px solid var(--border); background: transparent; width: 96px; text-align: center;
  }
  .ep-btn.download { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 50%, transparent); }
  .ep-btn.download:hover { background: color-mix(in srgb, var(--accent) 14%, transparent); }
  .ep-btn.retry { color: var(--red); border-color: color-mix(in srgb, var(--red) 50%, transparent); }
  .ep-btn.retry:hover { background: color-mix(in srgb, var(--red) 12%, transparent); }
  .ep-btn.delete { color: var(--muted); }
  .ep-btn.delete:hover { color: var(--red); border-color: var(--red); }
  .ep-btn.busy { color: var(--amber); border-color: color-mix(in srgb, var(--amber) 50%, transparent); cursor: default; }
  .ep-none { padding: 8px 16px 14px; color: var(--muted); font-size: 13px; }

  .empty {
    text-align: center; color: var(--muted); padding: 56px 16px; margin-top: 20px;

  }

  .empty p { font-size: 14px; max-width: 520px; margin: 0 auto 14px; }
  .empty.err h2 { color: var(--red); }

  /* failed downloads view */
  .fv-bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin: 8px 0 12px; }
  .fv-bar .grow { flex: 1 1 200px; font-size: 14px; }
  .fail-list { background: var(--card); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
  .fail-row { display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-top: 1px solid var(--border-soft); flex-wrap: wrap; }
  .fail-row:first-child { border-top: none; }
  .fail-row .st { color: var(--red); display: inline-flex; }
  .fail-row .txt { flex: 1 1 240px; min-width: 0; }
  .fail-row .nm { font-size: 14px; font-weight: 600; overflow-wrap: anywhere; }
  .fail-row .sub2 { font-size: 12.5px; color: var(--muted); margin-top: 2px; overflow-wrap: anywhere; }
  .fail-row .sub2 .link-btn { padding: 0; font-size: 12.5px; text-decoration: underline; }
  .fail-row .att { font-size: 12px; color: var(--red); font-weight: 650; white-space: nowrap; }
  .fail-row .ep-btn { width: auto; padding: 5px 12px; }

  /* modal */
  #modalWrap { display: none; position: fixed; inset: 0; background: var(--overlay); z-index: 50; align-items: flex-start; justify-content: center; padding: 6vh 16px; }
  #modalWrap.open { display: flex; }
  #modal { background: var(--card); border: 1px solid var(--border); border-radius: 16px; width: 100%; max-width: 720px; max-height: 86vh; display: flex; flex-direction: column; box-shadow: var(--shadow); }
  #modal .m-head { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  #modal .m-head h2 { font-size: 16px; flex: 1 1 160px; min-width: 0; overflow-wrap: anywhere; }
  #modal .m-head input { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; font-size: 13px; width: 220px; max-width: 100%; }
  #modal .m-body { overflow-y: auto; padding: 4px 0 12px; }
  #modal .m-more { text-align: center; padding: 10px; }
  .pl-row { display: flex; align-items: center; gap: 12px; padding: 9px 16px; border-top: 1px solid var(--border-soft); font-size: 13px; }
  .pl-row img { width: 48px; height: 36px; border-radius: 6px; object-fit: cover; background: var(--border); flex-shrink: 0; }
  .pl-row .t { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .pl-row .c { color: var(--muted); font-size: 12px; white-space: nowrap; }

  .series-row { display: flex; align-items: center; gap: 12px; padding: 10px 18px; border-top: 1px solid var(--border-soft); font-size: 13px; }
  .series-row .t { flex: 1; min-width: 0; overflow-wrap: anywhere; }

  .m-custom input { flex: 1 1 200px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; font-size: 13px; }
  .m-custom .note { flex: 1 1 200px; font-size: 12.5px; color: var(--muted); }
  .m-banner { width: 100%; display: block; max-height: 110px; object-fit: cover; }

  #toasts { position: fixed; bottom: 16px; left: 16px; right: 16px; z-index: 80; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
  .toast { pointer-events: auto; max-width: 560px; width: 100%; background: var(--card); border: 1px solid var(--border); border-left: 4px solid var(--accent); border-radius: 10px; padding: 10px 14px; font-size: 13px; box-shadow: var(--shadow); }
  .toast.err { border-left-color: var(--red); }

  @media (prefers-reduced-motion: reduce) {

  }

<script>
const token = new URLSearchParams(location.search).get('token');
const tok = token ? '?token=' + encodeURIComponent(token) : '';
let publicUrl = '';
let sbDefault = '';
let remoteTok = tok;
let coverVersion = Date.now();
let coverPodcastId = null;
let collapsed = new Set();
let groupIds = [];
let groupMode = 'channel';   // 'channel' | 'sub'
let activeFilter = 'all';    // all | sub | unsub | fail | manual
let logErrorsOnly = false;
let lastEvents = [];
let stats = null;
let view = 'pods';          // pods | add | failed | log
let failedData = null;      // {total, episodes} from /api/failed
let failedErr = '';
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
try { collapsed = new Set(JSON.parse(lsGet('jojoCollapsed') || '[]')); } catch (e) {}
if (lsGet('jojoGroup') === 'sub') groupMode = 'sub';
if (['all', 'sub', 'unsub', 'fail', 'manual'].includes(lsGet('jojoFilter'))) activeFilter = lsGet('jojoFilter');

/* ---- icons (static markup only, never server data) ---- */
const ICON = {
  check: '<path d="M20 6 9 17l-5-5"/>',
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  spin: '<path d="M21 12a9 9 0 1 1-6.2-8.55"/>',
  x: '<circle cx="12" cy="12" r="9"/><path d="m15 9-6 6M9 9l6 6"/>',
  edit: '<path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>',
  chev: '<path d="m9 6 6 6-6 6"/>',
  trash: '<path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  play: '<path d="M8 5v14l11-7Z"/>',
  split: '<path d="M6 3v6a4 4 0 0 0 4 4h4a4 4 0 0 1 4 4v4M6 3 3 6M6 3l3 3"/>',
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  moon: '<path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/>',
  link: '<path d="M7 17 17 7M8 7h9v9"/>',
  alert: '<path d="M12 3 2 20h20Z"/><path d="M12 10v4M12 17v.01"/>',
  download: '<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>',
  retry: '<path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5"/>'
};
function I(name) { return '<svg class="i" viewBox="0 0 24 24" aria-hidden="true">' + (ICON[name] || '') + '</svg>'; }

/* ---- theme ---- */
function effectiveTheme() {
  const t = document.documentElement.getAttribute('data-theme');
  if (t === 'light' || t === 'dark') return t;
  return (window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
}
function paintThemeBtn() {
  const dark = effectiveTheme() === 'dark';
  document.getElementById('themeBtn').innerHTML = I(dark ? 'sun' : 'moon');
  document.getElementById('themeBtn').title = dark ? 'Switch to light theme' : 'Switch to dark theme';
}
function toggleTheme() {
  const next = effectiveTheme() === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  lsSet('jojoTheme', next);
  paintThemeBtn();
}

/* ---- helpers ---- */
fetch('/api/config' + tok).then(r => r.json()).then(c => {
  publicUrl = c.publicUrl || '';
  sbDefault = c.sbDefault || '';
  if (c.token) remoteTok = '?token=' + encodeURIComponent(c.token);
  const link = document.getElementById('remoteLink');
  if (publicUrl && remoteTok) {
    link.href = publicUrl + '/' + remoteTok;
    link.style.display = 'inline-flex';
  }
  if (tok) document.getElementById('opmlLink').href = '/opml' + tok;
  load();
}).catch(() => {});

function fmtDate(iso) {
  const d = new Date(iso);
  if (isNaN(d)) return '';
  return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
}
function fmtTime(iso) {
  const d = new Date(iso);
  if (isNaN(d)) return '';
  return d.toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' });
}
function ago(unixSec) {
  const s = Math.floor(Date.now() / 1000) - unixSec;
  if (s < 90) return 'just now';
  if (s < 5400) return Math.round(s / 60) + 'm ago';
  if (s < 129600) return Math.round(s / 3600) + 'h ago';
  return Math.round(s / 86400) + 'd ago';
}
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
// esc() is an HTML-TEXT encoder and is wrong inside an inline event handler:
// the parser decodes entities in an attribute value before the contents are
// compiled as JavaScript, so esc()'s &#39; becomes a real quote again and ends
// the string literal. Feed titles and episode titles come from YouTube, so that
// was script injection. jsq() emits a complete, self-quoted JS literal instead,
// with the characters that could reopen HTML parsing escaped as \u sequences.
function jsq(v) {
  return JSON.stringify(String(v == null ? '' : v))
    .replace(/</g, '\\u003c').replace(/>/g, '\\u003e')
    .replace(/&/g, '\\u0026').replace(/'/g, '\\u0027')
    // ...and the quote JSON.stringify itself uses. These literals sit inside
    // DOUBLE-quoted attributes, so an unescaped " ends the attribute: it broke
    // every button and reopened the injection this function exists to close.
    // &quot; is decoded back to " before the JS is compiled, which is exactly
    // what the literal needs, while being inert to the attribute parser.
    .replace(/"/g, '&quot;');
}
function toast(msg, kind) {
  const box = document.getElementById('toasts');
  const el = document.createElement('div');
  el.className = 'toast ' + (kind || '');
  el.textContent = msg;   // textContent: never parsed as HTML
  box.appendChild(el);
  setTimeout(() => el.remove(), kind === 'err' ? 7000 : 3500);
}
// Turn a failed response into a readable sentence (server may send JSON {message} or plain text).
async function errText(res, fallback) {
  try {
    const t = await res.text();
    try { const j = JSON.parse(t); if (j && j.message) return String(j.message); } catch (e) {}
    if (t && t.length < 300) return t.trim();
  } catch (e) {}
  return fallback + ' (HTTP ' + res.status + ')';
}

/* ---- episode rows ---- */
function epState(e) {
  if (e.downloading) return 'dling';
  if (e.downloaded) return 'dl';
  if (e.failedCount > 0) return 'fail';
  return 'nd';
}
const EP_LABEL = { dl: 'Downloaded', dling: 'Downloading', fail: 'Failed', nd: 'Not downloaded' };
const EP_ICON = { dl: 'check', dling: 'spin', fail: 'alert', nd: 'clock' };
function epRow(e) {
  const st = epState(e);
  let btn;
  if (st === 'dling') btn = '<button class="ep-btn busy" disabled>Downloading...</button>';
  else if (st === 'dl') btn = `<button class="ep-btn delete" onclick="deleteEpisode(${jsq(e.videoId)})">Delete file</button>`;
  else if (st === 'fail') btn = `<button class="ep-btn retry" title="${esc(e.failedCount)} failed attempt(s)" onclick="downloadEpisode(${jsq(e.videoId)}, this)">Retry (${esc(e.failedCount)}x failed)</button>`;
  else btn = `<button class="ep-btn download" onclick="downloadEpisode(${jsq(e.videoId)}, this)">Download</button>`;
  return `
    <div class="ep">
      <span class="st ${st}" title="${EP_LABEL[st]}" role="img" aria-label="${EP_LABEL[st]}">${I(EP_ICON[st])}</span>
      <div class="title" title="${esc(e.name)}">${esc(e.name)}</div>
      <div class="date">${esc(fmtDate(e.publishedDate))}</div>
      ${btn}
    </div>`;
}
function epCounts(p) {
  const c = { dl: 0, fail: 0, dling: 0, nd: 0 };
  for (const e of (p.episodes || [])) c[epState(e)]++;
  return c;
}

/* ---- summary tiles, filters ---- */
function renderTiles() {
  const pods = window._pods || [];
  const tot = { dl: 0, fail: 0, dling: 0, nd: 0 };
  for (const p of pods) { const c = epCounts(p); for (const k in tot) tot[k] += c[k]; }
  const tile = (v, l, cls, filter) => {
    const inner = `<div class="v">${v}</div><div class="l">${l}</div>`;
    return filter
      ? `<button class="tile ${cls}" onclick="navTo(${jsq(filter)})" title="Show these episodes">${inner}</button>`
      : `<div class="tile ${cls}">${inner}</div>`;
  };
  const gb = stats ? (stats.storedBytes / 1e9).toFixed(1) + ' GB' : '<span class="skel"></span>';
  const files = stats ? esc(stats.storedFiles) : '<span class="skel"></span>';
  const hrs = stats ? (stats.totalSkippedSeconds / 3600).toFixed(1) + ' h' : '<span class="skel"></span>';
  const loaded = !!window._pods;
  const failN = failedData ? Number(failedData.total) || 0 : tot.fail;
  document.getElementById('tiles').innerHTML =
    tile(loaded ? pods.length : '-', 'feeds' + (loaded ? ' (' + pods.filter(p => p.subscribed).length + ' subscribed)' : ''), '', '') +
    tile(files, 'episodes on disk (' + gb.replace(/<[^>]*>/g, '') + ')', 'good', '') +
    tile(hrs, 'sponsor time skipped', '', '') +
    tile(loaded ? tot.dling + tot.nd : '-', 'recent episodes pending' + (tot.dling ? ' (' + tot.dling + ' downloading)' : ''), tot.dling ? 'busy' : '', '') +
    tile(failedData || loaded ? failN : '-', 'failed downloads', failN ? 'warn' : '', failN ? 'failed' : '');
  const al = document.getElementById('failAlert');
  if (failN) {
    al.className = 'alert show';
    al.innerHTML = `<span style="color:var(--red)">${I('alert')}</span><span class="grow"><b>${failN} episode(s) failed to download.</b> Review them and retry, or check the activity log for the reason.</span>` +
      `<button class="btn sm" onclick="navTo('failed')">Review failed</button><button class="btn sm" onclick="openLog()">Open log</button>`;
  } else {
    al.className = 'alert';
    al.innerHTML = '';
  }
}
const FILTERS = [
  ['all', 'All', p => true],
  ['sub', 'Subscribed', p => !!p.subscribed],
  ['unsub', 'Not subscribed', p => !p.subscribed],
  ['fail', 'Has failures', p => epCounts(p).fail > 0],
  ['manual', 'Auto-download off', p => !p.autoDownload]
];
function renderFilters() {
  const pods = window._pods || [];
  document.getElementById('filters').innerHTML = FILTERS.map(([k, label, fn]) =>
    `<button class="pill" aria-pressed="${activeFilter === k}" onclick="setFilter(${jsq(k)})">${label}${window._pods ? `<span class="n">${pods.filter(fn).length}</span>` : ''}</button>`).join('');
  document.getElementById('gmChannel').setAttribute('aria-pressed', groupMode === 'channel');
  document.getElementById('gmSub').setAttribute('aria-pressed', groupMode === 'sub');
}
function setFilter(k) { activeFilter = k; lsSet('jojoFilter', k); if (view !== 'pods') { view = 'pods'; applyView(); } renderPods(); }

let searchTimer = null;

/* ---- main render ---- */
async function load() {
  const grid = document.getElementById('grid');
  try {
    const res = await fetch('/api/podcasts' + tok);
    if (!res.ok) throw new Error(await errText(res, 'Could not load podcasts'));
    let pods = await res.json();
    // nest filtered sub-feeds directly after their parent
    const parents = pods.filter(p => !p.parentId);
    const ordered = [];
    for (const par of parents) {
      ordered.push(par);
      for (const child of pods.filter(p => p.parentId === par.id)) ordered.push(child);
    }
    for (const orphan of pods.filter(p => p.parentId && !parents.some(x => x.id === p.parentId))) ordered.push(orphan);
    window._pods = ordered;
    renderPods();
  } catch (e) {
    if (!window._pods) {
      grid.innerHTML = `<div class="empty err"><h2>Could not load podcasts</h2><p>${esc(e.message)}</p><button class="btn" onclick="loadAll()">Try again</button></div>`;
    } else {
      toast('Refresh failed: ' + e.message, 'err');
    }
  }
}

function feedLink(p) { return publicUrl ? publicUrl + p.feedPath + remoteTok : location.origin + p.feedPath + tok; }

function renderPods() {
  const grid = document.getElementById('grid');
  renderTiles();
  renderFilters();
  paintNav();
  renderTree();
  const all = window._pods;
  if (!all) return;
  if (!all.length) {
    grid.innerHTML = '<div class="empty"><h2>No podcasts yet</h2><p>Open Add / Browse to paste a YouTube playlist or channel, or browse a channel to pick from all of its playlists at once.</p><button class="btn primary" onclick="navTo(\'add\')">Add a podcast</button></div>';
    return;
  }
  const q = document.getElementById('search').value.trim().toLowerCase();
  const filt = FILTERS.find(f => f[0] === activeFilter) || FILTERS[0];
  const pods = all.filter(p => filt[2](p) &&
    (!q || (p.name + ' ' + (p.originalName || '') + ' ' + (p.channelTitle || '')).toLowerCase().includes(q)));
  if (!pods.length) {
    grid.innerHTML = `<div class="empty"><h2>No podcasts match</h2><p>Nothing matches ${q ? '"' + esc(q) + '"' : ''}${q && activeFilter !== 'all' ? ' with ' : ''}${activeFilter !== 'all' ? 'the "' + esc(filt[1]) + '" filter' : ''}.</p><button class="btn" onclick="clearFilters()">Clear filters</button></div>`;
    return;
  }

  // group: by owning channel (children inherit the parent's channel) or by subscription state
  const chanOf = p => {
    if (p.parentId) {
      const par = all.find(x => x.id === p.parentId);
      if (par) return par.channelId || '';
    }
    return p.channelId || '';
  };
  const groups = new Map();
  for (const p of pods) {
    const cid = groupMode === 'sub' ? (p.subscribed ? 'sub:yes' : 'sub:no') : (chanOf(p) || '__ungrouped__');
    if (!groups.has(cid)) groups.set(cid, []);
    groups.get(cid).push(p);
  }
  const entries = [...groups.entries()].sort((a, b) => {
    if (groupMode === 'sub') return a[0] === 'sub:yes' ? -1 : 1;
    if (a[0] === '__ungrouped__') return 1;
    if (b[0] === '__ungrouped__') return -1;
    return (a[1][0].channelTitle || '').localeCompare(b[1][0].channelTitle || '');
  });
  groupIds = entries.map(([cid]) => cid);
  // searching/filtering always shows matches: ignore collapsed state then
  const forceOpen = !!q || activeFilter !== 'all';
  grid.innerHTML = entries.map(([cid, list]) => {
    const first = list.find(p => p.channelTitle) || list[0];
    const open = forceOpen || !collapsed.has(cid);
    const toggle = (label, extra) => `<button class="toggle" aria-expanded="${open}" onclick="toggleChannel(${jsq(cid)})"><span class="caret${open ? ' open' : ''}">${I('chev')}</span>${extra || ''}<span class="name">${label}</span><span class="cnt">${list.length} feed(s)</span></button>`;
    let head;
    if (groupMode === 'sub') {
      head = `<section class="chan-head"><div class="row">${toggle(cid === 'sub:yes' ? 'Subscribed' : 'Not subscribed')}</div></section>`;
    } else if (cid === '__ungrouped__') {
      head = `<section class="chan-head"><div class="row">${toggle('Other feeds')}</div></section>`;
    } else {
      head = `<section class="chan-head">
        ${open && first.channelBanner ? `<img class="banner" alt="" src="${esc(first.channelBanner)}=w1600" onerror="this.style.display='none'">` : ''}
        <div class="row">
          ${toggle(esc(first.channelTitle || 'Channel'), `<img class="avatar" alt="" src="${esc(first.channelThumb)}" onerror="this.style.visibility='hidden'">`)}
          <div class="tools">
            <a class="btn sm" target="_blank" rel="noopener" href="https://www.youtube.com/channel/${esc(cid)}">${I('play')} Channel</a>
            <button class="btn sm" onclick="browsePlaylists(${jsq(cid)})">${I('plus')} Browse channel</button>
            <button class="btn sm danger" onclick="removeChannel(${jsq(cid)}, ${jsq(first.channelTitle || 'this channel')}, ${list.length})">${I('trash')} Remove all</button>
          </div>
        </div>
      </section>`;
    }
    return head + (open ? `<div class="grid">` + list.map(p => renderCard(p, all)).join('') + `</div>` : '');
  }).join('');
}

function toggleChannel(cid) {
  if (collapsed.has(cid)) collapsed.delete(cid); else collapsed.add(cid);
  lsSet('jojoCollapsed', JSON.stringify([...collapsed]));
  renderPods();
}
function setAllChannels(collapse) {
  collapsed = new Set(collapse ? [...groupIds] : []);
  lsSet('jojoCollapsed', JSON.stringify([...collapsed]));
  renderPods();
}

async function removeChannel(channelId, name, count) {
  if (!confirm(`Remove all ${count} feed(s) from "${name}"? Downloaded audio files are kept.`)) return;
  const res = await fetch('/api/channels/' + encodeURIComponent(channelId) + tok, { method: 'DELETE' });
  if (res.ok) { toast('Removed feeds from ' + name, 'ok'); loadAll(); }
  else toast(await errText(res, 'Failed to remove channel feeds'), 'err');
}

    const res = await fetch('/api/events' + tok);

    lastEvents = await res.json();
    renderLog();
  } catch (e) {}
}
function renderLog() {
  const events = lastEvents || [];
  const errs = events.filter(e => e.level === 'error').length;
  document.getElementById('errCount').textContent = errs ? String(errs) : '';
  document.getElementById('errCount').title = errs ? errs + ' recent error(s)' : '';
  document.getElementById('logInfo').textContent = events.length ? `${events.length} recent events, ${errs} error(s)` : '';
  const shown = logErrorsOnly ? events.filter(e => e.level === 'error') : events;
  document.getElementById('logList').innerHTML = shown.length
    ? shown.map(e => `<div class="log-line ${e.level === 'error' ? 'error' : 'info'}"><span class="t">${esc(fmtTime(e.time))}</span><span class="m">${esc(e.message)}</span></div>`).join('')
    : `<div class="log-empty">${logErrorsOnly ? 'No errors. All quiet.' : 'No activity yet.'}</div>`;
}
function toggleLogErrors() {
  logErrorsOnly = !logErrorsOnly;
  document.getElementById('logErrOnly').setAttribute('aria-pressed', logErrorsOnly);
  renderLog();
}

/* ---- add / browse ---- */
async function addPodcast() {
  const input = document.getElementById('input');
  const btn = document.getElementById('addBtn');
  const status = document.getElementById('status');
  const val = input.value.trim();
  if (!val) { status.className = 'err'; status.textContent = 'Paste a YouTube playlist or channel URL, ID or @handle first.'; return; }

  // channel playlists URL -> browse mode
  if (/\/playlists\/?$/.test(val)) return browsePlaylists(val);

  btn.disabled = true;
  status.className = '';
  status.textContent = 'Adding: fetching metadata and episodes from YouTube, this can take a minute...';
  try {
    const res = await fetch('/api/podcasts' + tok, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ input: val })
    });
    const body = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(body.message || 'Failed to add podcast (HTTP ' + res.status + ')');
    status.className = 'ok';
    status.textContent = `Added "${body.name}". Recent episodes will start downloading automatically.`;
    input.value = '';
    loadAll();
  } catch (e) {
    status.className = 'err';
    status.textContent = e.message;
  } finally {
    btn.disabled = false;
  }
}

function plRow(pl) {
  const have = (window._pods || []).some(p => p.id === pl.id);
  return `
    <div class="pl-row" data-plid="${esc(pl.id)}">
      <img src="${esc(pl.thumbnail)}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">
      <div class="t">${esc(pl.title)}</div>
      <div class="c">${esc(pl.count)} videos</div>
      ${have
        ? `<button class="btn sm" style="color:var(--green)" onclick="removePodcast(${jsq(pl.id)},${jsq(pl.title)})">Subscribed, remove</button>`
        : `<button class="btn sm primary" onclick="subscribePlaylist(${jsq(pl.id)}, this)">Subscribe</button>`}
    </div>`;
}

async function browsePlaylists(url) {
  const status = document.getElementById('status');
  if (!url) { status.className = 'err'; status.textContent = 'Enter a channel URL, ID, or @handle first.'; return; }

  // open the overlay immediately, in view wherever the page is scrolled to
  document.getElementById('modalTitle').textContent = 'Browsing channel...';
  document.getElementById('modalSearch').style.display = 'none';
  const body = document.getElementById('modalBody');
  body.innerHTML = '<div class="log-empty">Looking up channel podcasts and playlists...</div>';
  openModal();
  status.className = '';
  status.textContent = '';

  try {
    const res = await fetch('/api/browse-playlists' + tok, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ input: url })
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.message || 'Failed to list playlists (HTTP ' + res.status + ')');
    const pods = data.podcasts || [], lists = data.playlists || [];
    const have = new Set((window._pods || []).map(p => p.id));
    const newPods = pods.map(p => p.id).filter(id => !have.has(id));
    const newLists = lists.map(p => p.id).filter(id => !have.has(id));
    const allIds = [...newPods, ...newLists];

    document.getElementById('modalTitle').textContent = data.channelTitle || 'Channel';
    body.innerHTML =
      (data.channelBanner ? `<img class="m-banner" alt="" src="${esc(data.channelBanner)}=w1600">` : '') +
      `<div class="pl-row" style="border-top:none;padding:12px 18px;flex-wrap:wrap">
        <img src="${esc(data.channelThumb)}" alt="" style="border-radius:50%;width:44px;height:44px" onerror="this.style.visibility='hidden'">
        <div class="t" style="font-weight:700;font-size:15px">${esc(data.channelTitle || 'Channel')}</div>
        <button class="btn sm primary" onclick="subscribePlaylist(${jsq(data.channelId)}, this)" title="One feed with all channel uploads">Whole channel</button>
        ${newPods.length ? `<button class="btn sm primary" onclick="subscribeAll(${jsq(JSON.stringify(newPods))}, this, 'podcasts')">All podcasts (${newPods.length})</button>` : ''}
        ${newLists.length ? `<button class="btn sm primary" onclick="subscribeAll(${jsq(JSON.stringify(newLists))}, this, 'playlists')">All playlists (${newLists.length})</button>` : ''}
        ${allIds.length ? `<button class="btn sm primary" onclick="subscribeAll(${jsq(JSON.stringify(allIds))}, this, 'feeds')">Everything (${allIds.length})</button>` : ''}
      </div>` +
      (pods.length ? `<h3 class="m-sec">Podcasts (${pods.length})</h3>` + pods.map(plRow).join('') : '') +
      (lists.length ? `<h3 class="m-sec">Playlists (${lists.length})</h3>` + lists.map(plRow).join('') : '') +
      (!pods.length && !lists.length ? '<div class="log-empty">No podcasts or playlists found on this channel.</div>' : '');
  } catch (e) {
    body.innerHTML = '<div class="log-empty err">' + esc(e.message) + '</div>';
  }
}

async function subscribeAll(ids, btn, label) {
  if (typeof ids === 'string') { try { ids = JSON.parse(ids); } catch (e) { return; } }
  const status = document.getElementById('status');
  const what = label || 'items';
  if (!confirm(`Subscribe to all ${ids.length} new ${what}? Each one fetches its full episode list, so this can take a while.`)) return;
  btn.disabled = true;
  let ok = 0, fail = 0;
  for (let i = 0; i < ids.length; i++) {
    status.className = '';
    status.textContent = `Subscribing ${i + 1} of ${ids.length}... (each feed fetches its full episode list, please wait)`;
    const rowBtn = document.querySelector(`.pl-row[data-plid="${CSS.escape(ids[i])}"] button`);
    try {
      const res = await fetch('/api/podcasts' + tok, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ input: ids[i] })
      });
      if (!res.ok) throw new Error();
      ok++;
      if (rowBtn) { rowBtn.textContent = 'Added'; rowBtn.disabled = true; }
    } catch (e) {
      fail++;
      if (rowBtn) rowBtn.textContent = 'Failed';
    }
  }
  status.className = fail ? 'err' : 'ok';
  status.textContent = `Bulk subscribe done: ${ok} added${fail ? ', ' + fail + ' failed' : ''}.`;
  btn.textContent = 'Done';
  loadAll();
}

// keep the older inline panel helper harmless if anything still calls it
function closeBrowse() { closeModal(); }
async function subscribePlaylist(id, btn) {
  btn.disabled = true;
  btn.textContent = 'Adding...';
  try {
    const res = await fetch('/api/podcasts' + tok, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ input: id })
    });
    const body = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(body.message || 'Failed to subscribe (HTTP ' + res.status + ')');
    btn.textContent = 'Added';
    loadAll();
  } catch (e) {
    btn.disabled = false;
    btn.textContent = 'Subscribe';
    toast(e.message, 'err');
  }
}

/* ---- modal plumbing ---- */
let lastFocus = null;
function openModal() {
  lastFocus = document.activeElement;
  document.getElementById('modalWrap').classList.add('open');
  document.getElementById('modal').querySelector('button.close, .m-head button')?.focus();
}
function closeModal() {
  document.getElementById('modalWrap').classList.remove('open');
  document.getElementById('modalBody').innerHTML = '';
  if (lastFocus && lastFocus.focus && document.contains(lastFocus)) lastFocus.focus();
}
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (document.getElementById('modalWrap').classList.contains('open')) closeModal();
  else if (drawerOpen()) closeDrawer();
});

/* ---- episode browser modal ---- */
let browserId = null, browserOffset = 0;
function openBrowser(id) {
  browserId = id; browserOffset = 0;
  const p = (window._pods || []).find(x => x.id === id);
  document.getElementById('modalTitle').textContent = p ? p.name : 'Episodes';
  const s = document.getElementById('modalSearch');
  s.style.display = 'inline-block'; s.value = '';
  document.getElementById('modalBody').innerHTML = '<div class="log-empty">Loading...</div>';
  openModal();
  fetchEpisodes(false);
}
function searchEpisodes() { browserOffset = 0; fetchEpisodes(false); }
async function fetchEpisodes(append) {
  const q = document.getElementById('modalSearch').value.trim();
  const body = document.getElementById('modalBody');
  const res = await fetch(`/api/podcasts/${encodeURIComponent(browserId)}/episodes${tok ? tok + '&' : '?'}q=${encodeURIComponent(q)}&offset=${browserOffset}&limit=50`);
  if (!res.ok) { body.innerHTML = '<div class="log-empty err">' + esc(await errText(res, 'Failed to load episodes')) + '</div>'; return; }
  const data = await res.json();
  const rows = (data.episodes || []).map(epRow).join('');
  const shown = browserOffset + (data.episodes || []).length;
  const more = shown < data.total
    ? `<div class="m-more"><button class="btn sm" onclick="browserOffset=${shown};fetchEpisodes(true)">Load more (${shown}/${data.total})</button></div>`
    : `<div class="m-more" style="color:var(--muted);font-size:12px">${esc(data.total)} episodes</div>`;
  if (append) {
    body.querySelector('.m-more')?.remove();
    body.insertAdjacentHTML('beforeend', rows + more);
  } else {
    body.innerHTML = (rows || '<div class="log-empty">No matching episodes.</div>') + more;
  }
}

/* ---- split (filtered sub-feed) ---- */
async function openSplit(id) {
  const p = (window._pods || []).find(x => x.id === id);
  document.getElementById('modalTitle').textContent = 'Split "' + (p ? p.name : '') + '" into a filtered feed';
  document.getElementById('modalSearch').style.display = 'none';
  const body = document.getElementById('modalBody');
  body.innerHTML = '<div class="log-empty">Detecting recurring series...</div>';
  openModal();
  const res = await fetch(`/api/podcasts/${encodeURIComponent(id)}/series` + tok);
  const series = res.ok ? await res.json() : [];
  window._series = series || [];
  const rows = (series || []).map((s, i) => `
    <div class="series-row">
      <input type="checkbox" class="ex-box" id="ex${i}" data-name="${esc(s.name)}" checked aria-label="Exclude ${esc(s.name)} from the everything-else feed" title="Include in the 'everything else' exclusions">
      <label class="t" for="ex${i}">${esc(s.name)}</label>
      <div class="c">${esc(s.count)} episodes</div>
      <button class="btn sm primary" onclick="createSplit(${jsq(id)}, ${jsq(s.name)}, this)">Create feed</button>
    </div>`).join('');
  body.innerHTML =
    `<div class="m-custom">
       <input id="customFilter" aria-label="Custom title filter" placeholder="...or type a custom title filter (case-insensitive substring)">

let navOpen = new Set();
try { navOpen = new Set(JSON.parse(lsGet('jojoNavOpen') || '[]')); } catch (e) {}
function saveNavOpen() { lsSet('jojoNavOpen', JSON.stringify([...navOpen])); }
function podActive(p) {

function chanKeyOf(p, all) {
  const par = p.parentId ? all.find(x => x.id === p.parentId) : null;
  return (par ? par.channelId : p.channelId) || '';
}
function treePodItem(p, all, kids) {
  const c = epCounts(p);
  const key = 'p:' + p.id;
  const open = navOpen.has(key);
  const label = p.name + ', ' + (Number(p.episodeCount) || 0) + ' episodes' + (c.fail ? ', ' + c.fail + ' failed' : '');

      <span class="caret">${I('chev')}</span><span class="nm">${esc(p.name)}</span>${c.fail ? `<span class="tfail" aria-hidden="true">${c.fail}</span>` : ''}</button>${detail}${sub}</li>`;
}
function treeGroup(key, headInner, label, count, fail, bodyHtml) {
  const open = navOpen.has(key);
  const gid = 'tg' + treeSeq++;
  return `<li><button class="tg" data-key="${esc(key)}" aria-expanded="${open}" aria-controls="${gid}" aria-label="${esc(label)}" title="${esc(label)}">
      <span class="caret">${I('chev')}</span>${headInner}<span class="tcnt" aria-hidden="true">${count}</span>${fail ? `<span class="tfail" aria-hidden="true">${fail}</span>` : ''}</button>
      <ul id="${gid}"${open ? '' : ' hidden'}>${bodyHtml}</ul></li>`;

let treeSeq = 0;
function renderTree() {
  const box = document.getElementById('navTree');
  const all = window._pods;
  if (!all || !all.length) { box.innerHTML = all ? '' : ''; return; }
  treeSeq = 0;
  const tops = all.filter(p => !p.parentId || !all.some(x => x.id === p.parentId));
  const kidsOf = id => all.filter(p => p.parentId === id);
  const failOf = list => list.reduce((n, p) => n + epCounts(p).fail, 0);
  const plural = (n, w) => n + ' ' + w + (n === 1 ? '' : 's');
  // channels
  const byChan = new Map();
  for (const p of tops) {
    const k = chanKeyOf(p, all) || '__none__';
    if (!byChan.has(k)) byChan.set(k, []);
    byChan.get(k).push(p);
  }
  const chans = [...byChan.entries()].sort((a, b) => {
    if (a[0] === '__none__') return 1; if (b[0] === '__none__') return -1;
    return (a[1][0].channelTitle || '').localeCompare(b[1][0].channelTitle || '');
  });
  const chanHtml = chans.map(([k, list]) => {
    const total = list.reduce((n, p) => n + 1 + kidsOf(p.id).length, 0);
    const fail = list.reduce((n, p) => n + failOf([p].concat(kidsOf(p.id))), 0);
    const first = list.find(p => p.channelTitle) || list[0];
    const name = k === '__none__' ? 'Playlists and other' : (first.channelTitle || 'Channel');
    const av = k !== '__none__' && first.channelThumb ? `<img class="av" alt="" src="${esc(first.channelThumb)}" loading="lazy" onerror="this.style.display='none'">` : `<span class="ic">${I('play')}</span>`;
    const label = name + ', ' + plural(total, 'podcast') + (fail ? ', ' + fail + ' failed' : '');
    return treeGroup('g:' + k, av + `<span class="nm">${esc(name)}</span>`, label, total, fail,
      list.map(p => treePodItem(p, all, kidsOf(p.id))).join(''));
  }).join('');
  // sources
  const isRss = p => p.source === 'rss' || p.type === 'RSS';
  const rss = all.filter(p => !p.parentId && isRss(p));
  const pls = all.filter(p => !p.parentId && !isRss(p));
  const filt = all.filter(p => p.parentId);
  const flat = list => list.map(p => `<li><button class="pi-flat" data-act="open" data-id="${esc(p.id)}" title="${esc(p.name)}"${podActive(p) ? ' aria-current="true"' : ''}>${esc(p.name)}</button></li>`).join('');
  const srcGroup = (key, name, list) => list.length ? treeGroup(key, `<span class="ic">${I('link')}</span><span class="nm">${name}</span>`,
    name + ', ' + plural(list.length, 'feed') + (failOf(list) ? ', ' + failOf(list) + ' failed' : ''), list.length, failOf(list), flat(list)) : '';
  const srcHtml = srcGroup('s:rss', 'RSS feeds', rss) + srcGroup('s:pl', 'Playlist feeds', pls) +
    (filt.length ? `<li><div class="pi-static">${I('split')}<span>Filtered sub-feeds: ${filt.length} (nested under their parent above)</span></div></li>` : '');
  const keep = document.activeElement && box.contains(document.activeElement) ? document.activeElement.dataset.key || document.activeElement.dataset.id : null;
  const keepAct = keep && document.activeElement.dataset.act;
  box.innerHTML = `<div class="nav-sec">Channels</div><ul>${chanHtml}</ul><div class="nav-sec">Sources</div><ul>${srcHtml}</ul>`;
  if (keep) {
    const el = [...box.querySelectorAll('button')].find(b => (keepAct ? b.dataset.act === keepAct && b.dataset.id === keep : b.dataset.key === keep));
    if (el) el.focus();
  }
}
function updateTreeActive() {
  const all = window._pods || [];
  document.querySelectorAll('#navTree [data-pid], #navTree .pi-flat').forEach(b => {
    const p = all.find(x => x.id === (b.dataset.pid || b.dataset.id));
    if (p && podActive(p)) b.setAttribute('aria-current', 'true'); else b.removeAttribute('aria-current');

function navOpenPod(id) {

  const p = all.find(x => x.id === id);

  navOpen.add('g:' + (chanKeyOf(p, all) || '__none__'));

(function () {
  const box = document.getElementById('navTree');
  box.addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b || !box.contains(b)) return;
    const all = window._pods || [];
    if (b.dataset.act) {
      const p = all.find(x => x.id === b.dataset.id);
      if (!p) return;
      if (b.dataset.act === 'open') navOpenPod(p.id);
      else if (b.dataset.act === 'dl') downloadAllEpisodes(p.id, p.name, Number(p.episodeCount) || 0);
      else if (b.dataset.act === 'copy') copyFeed(feedLink(p), b);

    }

    if (navOpen.has(k)) navOpen.delete(k); else navOpen.add(k);
    saveNavOpen();

  });
  box.addEventListener('keydown', e => {

    const f = [...box.querySelectorAll('button')].filter(el => el.offsetParent !== null);
    const i = f.indexOf(document.activeElement);

async function loadFailed() {
  try {
    const res = await fetch('/api/failed' + tok);
    if (!res.ok) throw new Error(await errText(res, 'Could not load failed downloads'));
    failedData = await res.json();
    failedErr = '';
  } catch (e) {
    failedErr = e.message;
  }
  renderTiles();
  paintNav();
  if (view === 'failed') renderFailed();
}
function renderFailed() {
  const box = document.getElementById('failedBody');
  if (failedErr && !failedData) {
    box.innerHTML = `<div class="empty err"><h2>Could not load failed downloads</h2><p>${esc(failedErr)}</p><button class="btn" onclick="loadFailed()">Try again</button></div>`;
    return;
  }
  if (!failedData) { box.innerHTML = '<div class="empty"><p>Loading failed downloads...</p></div>'; return; }
  const eps = failedData.episodes || [];
  const total = Number(failedData.total) || eps.length;
  if (!total && !eps.length) {
    box.innerHTML = `<div class="empty"><h2>No failed downloads</h2><p>Every episode that was tried has downloaded, or is still waiting its turn. Failures will show up here with a retry button.</p><button class="btn" onclick="navTo('all')">Back to all podcasts</button></div>`;
    return;
  }
  const rows = eps.map(e => `
    <div class="fail-row">
      <span class="st">${I('alert')}</span>
      <div class="txt">
        <div class="nm">${esc(e.name)}</div>
        <div class="sub2"><button class="link-btn" title="Show this podcast" onclick="goPodcast(${jsq(e.podcastName)})">${esc(e.podcastName)}</button></div>
      </div>
      <span class="att">${esc(e.attempts)} failed attempt(s)</span>
      <button class="ep-btn retry" onclick="downloadEpisode(${jsq(e.videoId)}, this)">Retry</button>
    </div>`).join('');
  box.innerHTML = `
    <div class="fv-bar">
      <span class="grow"><b>${esc(total)}</b> episode(s) failed to download.${total > eps.length ? ' Showing the first ' + esc(eps.length) + '.' : ''}</span>
      <button class="btn" onclick="openLog()">View errors in log</button>
      <button class="btn primary" id="retryAllBtn" onclick="retryAllFailed(this)">${I('retry')} Retry all</button>
    </div>
    <div class="fail-list">${rows}</div>`;
}
async function retryAllFailed(btn) {
  btn.disabled = true;
  try {
    const res = await fetch('/api/failed/retry' + tok, { method: 'POST' });
    if (!res.ok) { toast(await errText(res, 'Could not queue the retries'), 'err'); return; }
    const j = await res.json().catch(() => ({}));
    const n = Number(j.queued) || 0;
    toast(n ? `Queued ${n} failed download(s) for retry.` : 'Nothing was queued.', n ? 'ok' : '');
    setTimeout(loadAll, 2000);
  } catch (e) {
    toast('Could not queue the retries: ' + e.message, 'err');
  } finally { btn.disabled = false; }
}
async function downloadAllEpisodes(id, name, count) {
  const n = Math.min(count || 0, 200);
  if (!confirm(`Download all episodes of "${name}"?\n\nUp to ${n || 'all'} episode(s) that are not downloaded yet will be queued (max 200). They download one at a time, so this can take a while.`)) return;
  try {
    const res = await fetch('/api/podcasts/' + encodeURIComponent(id) + '/download-all' + tok, { method: 'POST' });
    if (!res.ok) { toast(await errText(res, 'Could not queue downloads'), 'err'); return; }
    const j = await res.json().catch(() => ({}));
    const q = Number(j.queued) || 0;
    toast(q ? `Queued ${q} episode(s) of "${name}" for download.` : `Nothing to queue for "${name}": everything is downloaded or already queued.`, q ? 'ok' : '');
    setTimeout(loadAll, 2000);
  } catch (e) {
    toast('Could not queue downloads: ' + e.message, 'err');
  }
}

      <label class="t" for="sb_${esc(key)}">
        <span style="font-weight:600;color:${isCustom ? 'var(--amber)' : 'var(--text)'}">${esc(key)}</span>
        ${isCustom ? '<span class="badge" style="margin-left:6px;background:color-mix(in srgb,var(--amber) 16%,transparent);color:var(--amber)">CUSTOM</span>' : ''}
        <div style="font-size:12px;color:var(--muted)">${esc(desc)}</div>
      </label>
      ${isCustom
        ? `<button class="btn sm" title="Remove this custom category" aria-label="Remove ${esc(key)}" onclick="removeSbCustom(${jsq(key)})">${I('trash')}</button>`
        : `<span class="c" title="Standard category: can be toggled but not removed">standard</span>`}
    </div>`;
}

function toggleSb(key) {
  if (sbState.selected.has(key)) sbState.selected.delete(key); else sbState.selected.add(key);
  sbState.usingDefault = false;
  renderSbEditor();
}
function addSbCustom() {
  const input = document.getElementById('sbNew');
  const val = (input.value || '').trim().toLowerCase().replace(/[^a-z0-9_]/g, '');
  if (!val) return;
  const std = SB_STANDARD.map(c => c[0]);
  if (!std.includes(val) && !sbState.custom.includes(val)) sbState.custom.push(val);
  sbState.selected.add(val);
  sbState.usingDefault = false;
  renderSbEditor();
}
function removeSbCustom(key) {
  sbState.custom = sbState.custom.filter(c => c !== key);
  sbState.selected.delete(key);
  sbState.usingDefault = false;
  renderSbEditor();
}
async function saveSb(useDefault) {
  const cats = useDefault ? '' : [...sbState.selected].join(',');
  await patchPodcast(sbState.id, { sbCategories: cats });
  closeModal();
}
function toggleSubscribed(id, current) { patchPodcast(id, { subscribed: !current }); }
function toggleAutoDl(id, current) { patchPodcast(id, { autoDownload: !current }); }
function toggleAdText(id, current) { patchPodcast(id, { adTextStrip: !current }); }

async function downloadEpisode(videoId, btn) {
  btn.textContent = 'Starting...';
  btn.className = 'ep-btn busy';
  const res = await fetch('/api/episodes/' + encodeURIComponent(videoId) + '/download' + tok, { method: 'POST' });
  if (!res.ok) toast(await errText(res, 'Failed to start download'), 'err');
  setTimeout(loadAll, 2000);
}
async function deleteEpisode(videoId) {
  if (!confirm('Delete the downloaded audio file for this episode? It can be re-downloaded any time.')) return;
  const res = await fetch('/api/episodes/' + encodeURIComponent(videoId) + '/file' + tok, { method: 'DELETE' });
  if (res.ok) loadAll();
  else toast(await errText(res, 'Failed to delete file'), 'err');
}
async function removePodcast(id, name) {
  if (!confirm(`Remove "${name}" from jojo-podcasts? Downloaded audio files are kept.`)) return;
  const res = await fetch('/api/podcasts/' + encodeURIComponent(id) + tok, { method: 'DELETE' });
  if (res.ok) loadAll();
  else toast(await errText(res, 'Failed to remove podcast'), 'err');
}
function copyFeed(url, btn) {
  const done = () => { const old = btn.textContent; btn.textContent = 'Copied'; setTimeout(() => btn.textContent = old, 1500); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(done, () => toast('Copy blocked by the browser. Long-press the Subscribe link instead.', 'err'));
  else toast('Copy needs HTTPS or localhost in this browser.', 'err');
}

paintThemeBtn();
renderFilters();
renderTiles();
applyView();
loadAll();
setInterval(loadAll, 20000);
</script>
</body>
</html>
